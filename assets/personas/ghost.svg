<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Thành viên "tàng hình" (Frog huddled under cozy blanket holding phone) -->
  <defs>
    <filter id="shadow-g" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#554477" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background circular tint -->
  <circle cx="200" cy="200" r="175" fill="#f0ebfa"/>

  <g filter="url(#shadow-g)">
    <!-- Cozy Blanket / Quilt wrapped around (Pastel Purple with tiny stars/dots) -->
    <path d="M120 180 C80 200 70 280 85 330 C120 355 280 355 315 330 C330 280 320 200 280 180 C270 220 250 250 200 250 C150 250 130 220 120 180 Z" fill="#dcd6f7" stroke="#2d1c24" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Blanket polka dots / stars pattern -->
    <circle cx="115" cy="260" r="5" fill="#a6b1e1"/>
    <circle cx="140" cy="300" r="6" fill="#a6b1e1"/>
    <circle cx="170" cy="330" r="5" fill="#a6b1e1"/>
    <circle cx="230" cy="330" r="5" fill="#a6b1e1"/>
    <circle cx="260" cy="300" r="6" fill="#a6b1e1"/>
    <circle cx="285" cy="260" r="5" fill="#a6b1e1"/>

    <!-- Frog Head peeking out -->
    <!-- Two big rounded eye humps on top of head -->
    <circle cx="155" cy="145" r="32" fill="#78e08f" stroke="#2d1c24" stroke-width="7"/>
    <circle cx="245" cy="145" r="32" fill="#78e08f" stroke="#2d1c24" stroke-width="7"/>

    <!-- Frog main face oval -->
    <ellipse cx="200" cy="175" rx="82" ry="60" fill="#78e08f" stroke="#2d1c24" stroke-width="7"/>

    <!-- Frog Eyeballs (Yellow with horizontal slit eyes - just like the Cool Frog License photo!) -->
    <ellipse cx="155" cy="145" rx="20" ry="17" fill="#ffd32a" stroke="#2d1c24" stroke-width="5"/>
    <line x1="140" y1="145" x2="170" y2="145" stroke="#2d1c24" stroke-width="7" stroke-linecap="round"/>
    <circle cx="152" cy="139" r="3" fill="#ffffff"/>

    <ellipse cx="245" cy="145" rx="20" ry="17" fill="#ffd32a" stroke="#2d1c24" stroke-width="5"/>
    <line x1="230" y1="145" x2="260" y2="145" stroke="#2d1c24" stroke-width="7" stroke-linecap="round"/>
    <circle cx="242" cy="139" r="3" fill="#ffffff"/>

    <!-- Shy little mouth (tiny line) -->
    <path d="M190 190 Q200 195 210 190" fill="none" stroke="#2d1c24" stroke-width="4" stroke-linecap="round"/>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="135" cy="180" rx="15" ry="9" fill="#ff7675" opacity="0.75"/>
    <ellipse cx="265" cy="180" rx="15" ry="9" fill="#ff7675" opacity="0.75"/>

    <!-- Sweat drop on head (anxious/invisible) -->
    <path d="M265 115 C265 107 272 100 272 100 C272 100 279 107 279 115 A7 7 0 1 1 265 115 Z" fill="#74b9ff" stroke="#2d1c24" stroke-width="3"/>

    <!-- Blanket top fold / collar overlapping the chin -->
    <path d="M125 205 Q200 245 275 205 Q285 240 260 255 Q200 275 140 255 Z" fill="#b8b5ff" stroke="#2d1c24" stroke-width="6" stroke-linejoin="round"/>

    <!-- Tiny frog paws holding a smartphone -->
    <rect x="175" y="245" width="50" height="70" rx="7" fill="#2d3436" stroke="#2d1c24" stroke-width="5"/>
    <!-- Phone screen glowing blue -->
    <rect x="180" y="252" width="40" height="54" rx="4" fill="#dff9fb"/>
    <!-- Chat bubble on phone with "Đã xem" / Seen -->
    <rect x="184" y="260" width="32" height="12" rx="3" fill="#00b894"/>
    <circle cx="193" cy="266" r="1.5" fill="#ffffff"/>
    <circle cx="200" cy="266" r="1.5" fill="#ffffff"/>
    <circle cx="207" cy="266" r="1.5" fill="#ffffff"/>
    <text x="185" y="285" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#636e72">ĐÃ XEM</text>
    <text x="185" y="295" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#b2bec3">23:59</text>

    <!-- Two cute green webbed fingers peeking holding the phone -->
    <ellipse cx="170" cy="280" rx="10" ry="8" fill="#78e08f" stroke="#2d1c24" stroke-width="4"/>
    <ellipse cx="230" cy="280" rx="10" ry="8" fill="#78e08f" stroke="#2d1c24" stroke-width="4"/>
  </g>
</svg>
