<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Thành viên trì hoãn (Sleepy Sloth hugging a pillow) -->
  <defs>
    <filter id="shadow-sl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#8c5836" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background circular tint -->
  <circle cx="200" cy="200" r="175" fill="#fdf0e6"/>

  <g filter="url(#shadow-sl)">
    <!-- Sloth Head -->
    <ellipse cx="200" cy="180" rx="90" ry="85" fill="#c4a482" stroke="#2d1c24" stroke-width="7"/>

    <!-- Cute Nightcap / Sleep cap on head -->
    <path d="M140 120 Q180 80 230 100 Q280 120 285 70 Q290 50 310 65 Q320 85 270 125 Z" fill="#9c88ff" stroke="#2d1c24" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="315" cy="65" r="14" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>

    <!-- Sloth Face Mask (lighter patch) -->
    <ellipse cx="200" cy="185" rx="72" ry="60" fill="#f5ebe0"/>

    <!-- Eye Patches (Characteristic dark patches) -->
    <ellipse cx="160" cy="185" rx="28" ry="18" fill="#a47e5b" transform="rotate(-15 160 185)"/>
    <ellipse cx="240" cy="185" rx="28" ry="18" fill="#a47e5b" transform="rotate(15 240 185)"/>

    <!-- Sleepy droopy eyes (horizontal closed slit eyes -_-) -->
    <path d="M148 185 Q160 192 172 185" fill="none" stroke="#2d1c24" stroke-width="5" stroke-linecap="round"/>
    <path d="M228 185 Q240 192 252 185" fill="none" stroke="#2d1c24" stroke-width="5" stroke-linecap="round"/>

    <!-- Nose & peaceful smile -->
    <ellipse cx="200" cy="200" rx="14" ry="10" fill="#2d1c24"/>
    <path d="M192 214 Q200 220 208 214" fill="none" stroke="#2d1c24" stroke-width="4" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="140" cy="205" rx="15" ry="9" fill="#ff7675" opacity="0.6"/>
    <ellipse cx="260" cy="205" rx="15" ry="9" fill="#ff7675" opacity="0.6"/>

    <!-- Giant Fluffy Pillow being hugged tightly -->
    <rect x="110" y="230" width="180" height="110" rx="30" fill="#ffffff" stroke="#2d1c24" stroke-width="7" transform="rotate(-4 200 285)"/>
    <!-- Pillow stitch / creases -->
    <path d="M135 245 Q200 260 265 245" fill="none" stroke="#dfe6e9" stroke-width="4"/>
    <path d="M135 320 Q200 305 265 320" fill="none" stroke="#dfe6e9" stroke-width="4"/>
    <circle cx="200" cy="285" r="5" fill="#fab1a0"/>

    <!-- Sloth Arms hugging the pillow -->
    <path d="M110 215 Q95 260 145 280" fill="#c4a482" stroke="#2d1c24" stroke-width="7" stroke-linecap="round"/>
    <path d="M290 215 Q305 260 255 280" fill="#c4a482" stroke="#2d1c24" stroke-width="7" stroke-linecap="round"/>
    <!-- Cute 3 Claws on each paw -->
    <line x1="145" y1="275" x2="148" y2="288" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="152" y1="274" x2="155" y2="287" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="273" x2="162" y2="286" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <line x1="255" y1="275" x2="252" y2="288" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="248" y1="274" x2="245" y2="287" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="241" y1="273" x2="238" y2="286" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Floating Zzz symbols -->
    <text x="270" y="110" font-family="'Comic Sans MS', cursive, sans-serif" font-size="28" font-weight="900" fill="#a29bfe">Z</text>
    <text x="300" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="900" fill="#a29bfe">z</text>
    <text x="325" y="55" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="900" fill="#a29bfe">z</text>
  </g>
</svg>
