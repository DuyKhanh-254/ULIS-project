<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Nhà hoà giải mâu thuẫn (Zen Capybara with an orange on its head) -->
  <defs>
    <filter id="shadow-c" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#55a57f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background circular tint -->
  <circle cx="200" cy="200" r="175" fill="#e7f9ee"/>

  <g filter="url(#shadow-c)">
    <!-- Water tub / Onsen ripples (Zen vibes) -->
    <ellipse cx="200" cy="330" rx="140" ry="30" fill="#a8e6cf" stroke="#2d1c24" stroke-width="6"/>
    <path d="M120 325 Q160 335 200 325 Q240 315 280 325" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Capybara Body -->
    <path d="M120 320 C110 250 130 190 170 180 C230 170 270 210 280 320 Z" fill="#b08968" stroke="#2d1c24" stroke-width="7" stroke-linejoin="round"/>

    <!-- Capybara Head (Square-ish, characteristic Capy profile) -->
    <rect x="135" y="130" width="130" height="110" rx="42" fill="#b08968" stroke="#2d1c24" stroke-width="7"/>

    <!-- Cute Small Ears -->
    <ellipse cx="140" cy="140" rx="14" ry="10" fill="#8d6748" stroke="#2d1c24" stroke-width="5" transform="rotate(-20 140 140)"/>
    <ellipse cx="260" cy="140" rx="14" ry="10" fill="#8d6748" stroke="#2d1c24" stroke-width="5" transform="rotate(20 260 140)"/>

    <!-- Orange (Yuzu) on flat head -->
    <ellipse cx="200" cy="115" rx="22" ry="19" fill="#ff9f43" stroke="#2d1c24" stroke-width="5"/>
    <!-- Orange Leaf -->
    <path d="M200 96 Q215 85 220 95 Q210 105 200 96 Z" fill="#2ed573" stroke="#2d1c24" stroke-width="3"/>
    <circle cx="195" cy="110" r="2.5" fill="#ffffff" opacity="0.8"/>

    <!-- Calm Snout (Lower muzzle) -->
    <ellipse cx="200" cy="205" rx="42" ry="26" fill="#8d6748"/>
    <!-- Nostrils (2 cute vertical dashes) -->
    <ellipse cx="190" cy="195" rx="3.5" ry="5.5" fill="#2d1c24"/>
    <ellipse cx="210" cy="195" rx="3.5" ry="5.5" fill="#2d1c24"/>
    <!-- Calm tiny mouth -->
    <path d="M200 201 L200 210 M192 210 Q200 217 208 210" fill="none" stroke="#2d1c24" stroke-width="4" stroke-linecap="round"/>

    <!-- Super Chill Closed Eyes (-_-) -->
    <line x1="148" y1="175" x2="172" y2="175" stroke="#2d1c24" stroke-width="6" stroke-linecap="round"/>
    <line x1="228" y1="175" x2="252" y2="175" stroke="#2d1c24" stroke-width="6" stroke-linecap="round"/>

    <!-- Cute Rosy Blushes -->
    <ellipse cx="145" cy="195" rx="14" ry="8" fill="#ff7675" opacity="0.6"/>
    <ellipse cx="255" cy="195" rx="14" ry="8" fill="#ff7675" opacity="0.6"/>

    <!-- Cute tiny paws resting in front holding cup of tea -->
    <ellipse cx="180" cy="285" rx="14" ry="12" fill="#8d6748" stroke="#2d1c24" stroke-width="5"/>
    <ellipse cx="220" cy="285" rx="14" ry="12" fill="#8d6748" stroke="#2d1c24" stroke-width="5"/>
    <!-- Bubble Tea cup -->
    <rect x="190" y="270" width="20" height="26" rx="4" fill="#ffffff" stroke="#2d1c24" stroke-width="4"/>
    <line x1="200" y1="262" x2="200" y2="280" stroke="#ff4757" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Zen flower / Lotus floating -->
    <path d="M95 320 Q105 305 115 320 Q105 328 95 320 Z" fill="#ff9ff3" stroke="#2d1c24" stroke-width="3"/>
    <path d="M295 322 Q305 307 315 322 Q305 330 295 322 Z" fill="#ff9ff3" stroke="#2d1c24" stroke-width="3"/>
  </g>
</svg>
