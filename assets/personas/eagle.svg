<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Người kiểm soát cầu toàn (Owl with thick spiral glasses & magnifying glass) -->
  <defs>
    <filter id="shadow-e" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#4a69bd" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background circular tint -->
  <circle cx="200" cy="200" r="175" fill="#e8f3fc"/>

  <g filter="url(#shadow-e)">
    <!-- Owl Ear Tufts / Horns -->
    <path d="M125 140 L105 75 L165 110 Z" fill="#4a69bd" stroke="#2d1c24" stroke-width="6" stroke-linejoin="round"/>
    <path d="M275 140 L295 75 L235 110 Z" fill="#4a69bd" stroke="#2d1c24" stroke-width="6" stroke-linejoin="round"/>

    <!-- Owl Body/Head -->
    <ellipse cx="200" cy="205" rx="92" ry="96" fill="#6a89cc" stroke="#2d1c24" stroke-width="7"/>

    <!-- Belly -->
    <ellipse cx="200" cy="255" rx="60" ry="50" fill="#f8f9fa" stroke="#2d1c24" stroke-width="5"/>
    <!-- Cute feather chevrons on belly -->
    <path d="M185 240 L195 247 L205 240 M195 255 L205 262 L215 255" fill="none" stroke="#6a89cc" stroke-width="4" stroke-linecap="round"/>

    <!-- Big Eye White Rings -->
    <circle cx="155" cy="185" r="38" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>
    <circle cx="245" cy="185" r="38" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>

    <!-- Pupils (Hyper-focused / Serious eyes) -->
    <circle cx="155" cy="185" r="16" fill="#2d1c24"/>
    <circle cx="150" cy="180" r="5" fill="#ffffff"/>
    <circle cx="245" cy="185" r="16" fill="#2d1c24"/>
    <circle cx="240" cy="180" r="5" fill="#ffffff"/>

    <!-- Thick Nerd Glasses (Black rounded frames with connecting bridge) -->
    <circle cx="155" cy="185" r="42" fill="none" stroke="#2d1c24" stroke-width="7"/>
    <circle cx="245" cy="185" r="42" fill="none" stroke="#2d1c24" stroke-width="7"/>
    <path d="M197 185 L203 185" stroke="#2d1c24" stroke-width="8" stroke-linecap="round"/>

    <!-- Cute Beak -->
    <polygon points="193,195 207,195 200,215" fill="#f39c12" stroke="#2d1c24" stroke-width="4"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="120" cy="225" rx="14" ry="8" fill="#ff7675" opacity="0.6"/>
    <ellipse cx="280" cy="225" rx="14" ry="8" fill="#ff7675" opacity="0.6"/>

    <!-- Wings -->
    <path d="M110 210 Q85 260 115 300 Q130 270 120 220" fill="#4a69bd" stroke="#2d1c24" stroke-width="6"/>

    <!-- Giant Magnifying Glass held in wing -->
    <!-- Handle -->
    <line x1="285" y1="315" x2="250" y2="270" stroke="#b33939" stroke-width="12" stroke-linecap="round"/>
    <line x1="285" y1="315" x2="250" y2="270" stroke="#2d1c24" stroke-width="14" stroke-linecap="round" style="z-index:-1"/>
    <!-- Lens Frame & Glass -->
    <circle cx="240" cy="255" r="34" fill="#81ecec" fill-opacity="0.45" stroke="#f1c40f" stroke-width="7"/>
    <circle cx="240" cy="255" r="34" fill="none" stroke="#2d1c24" stroke-width="9"/>
    <!-- Glass reflection -->
    <path d="M225 240 Q240 230 252 240" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Typo red X visible inside lens -->
    <text x="233" y="265" font-family="'Comic Sans MS', sans-serif" font-size="26" font-weight="900" fill="#e74c3c">✕</text>
  </g>
</svg>
