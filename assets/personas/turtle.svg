<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Bạch tuộc ôm việc (Overworking Octopus) -->
  <defs>
    <filter id="shadow-t" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#a63d60" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background circular tint -->
  <circle cx="200" cy="200" r="175" fill="#ffeaf1"/>
  
  <g filter="url(#shadow-t)">
    <!-- Back Tentacles holding items -->
    <!-- Tentacle top-left holding coffee -->
    <path d="M120 180 Q60 140 70 95 Q85 80 100 110 Q110 135 135 170" fill="#ff7f9d" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coffee cup -->
    <rect x="55" y="65" width="32" height="38" rx="5" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>
    <path d="M87 75 Q102 75 102 85 Q102 95 87 95" fill="none" stroke="#2d1c24" stroke-width="5"/>
    <path d="M63 60 Q68 50 64 42 M73 60 Q78 50 74 42" stroke="#d48a60" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tentacle top-right holding clock -->
    <path d="M280 180 Q340 140 330 95 Q315 80 300 110 Q290 135 265 170" fill="#ff7f9d" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Clock 23:59 -->
    <circle cx="335" cy="85" r="24" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>
    <path d="M335 85 L335 70 M335 85 L346 85" stroke="#e84118" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Tentacle middle-left holding document stack -->
    <path d="M110 220 Q40 210 45 260 Q55 285 90 260 Q110 245 130 235" fill="#ff7f9d" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Folder/Papers -->
    <rect x="30" y="240" width="48" height="34" rx="4" fill="#fbc531" stroke="#2d1c24" stroke-width="5" transform="rotate(-12 54 257)"/>
    <rect x="34" y="246" width="40" height="24" rx="2" fill="#ffffff" stroke="#2d1c24" stroke-width="3" transform="rotate(-12 54 257)"/>
    
    <!-- Tentacle middle-right holding laptop -->
    <path d="M290 220 Q360 210 355 260 Q345 285 310 260 Q290 245 270 235" fill="#ff7f9d" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Laptop -->
    <rect x="325" y="240" width="46" height="30" rx="3" fill="#718093" stroke="#2d1c24" stroke-width="5" transform="rotate(15 348 255)"/>
    <rect x="330" y="244" width="36" height="20" rx="2" fill="#dcdde1" transform="rotate(15 348 255)"/>

    <!-- Bottom Tentacles -->
    <path d="M140 280 Q120 350 160 360 Q180 360 175 320 Q170 290 165 280" fill="#ff6b8b" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M260 280 Q280 350 240 360 Q220 360 225 320 Q230 290 235 280" fill="#ff6b8b" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M190 290 Q200 370 210 290" fill="#ff6b8b" stroke="#2d1c24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Octopus Head / Body -->
    <ellipse cx="200" cy="205" rx="88" ry="92" fill="#ff6b8b" stroke="#2d1c24" stroke-width="7"/>
    <!-- Head highlight / spots -->
    <circle cx="160" cy="150" r="14" fill="#ff8fa8"/>
    <circle cx="185" cy="135" r="9" fill="#ff8fa8"/>

    <!-- Sweat Drops 💦 -->
    <path d="M255 140 C255 130 265 120 265 120 C265 120 275 130 275 140 A10 10 0 1 1 255 140 Z" fill="#00d2d3" stroke="#2d1c24" stroke-width="4"/>
    <path d="M135 155 C135 148 142 140 142 140 C142 140 149 148 149 155 A7 7 0 1 1 135 155 Z" fill="#00d2d3" stroke="#2d1c24" stroke-width="3"/>

    <!-- Eyes (Stressed / Wide Comic Eyes) -->
    <ellipse cx="165" cy="205" rx="16" ry="19" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>
    <ellipse cx="235" cy="205" rx="16" ry="19" fill="#ffffff" stroke="#2d1c24" stroke-width="5"/>
    <!-- Pupils - looking crazy/overworked -->
    <circle cx="167" cy="206" r="8" fill="#2d1c24"/>
    <circle cx="164" cy="203" r="3" fill="#ffffff"/>
    <circle cx="233" cy="206" r="8" fill="#2d1c24"/>
    <circle cx="230" cy="203" r="3" fill="#ffffff"/>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="140" cy="225" rx="14" ry="8" fill="#ff3838" opacity="0.6"/>
    <ellipse cx="260" cy="225" rx="14" ry="8" fill="#ff3838" opacity="0.6"/>

    <!-- Mouth (nervous wavy smile: ~) -->
    <path d="M185 235 Q192 242 200 236 Q208 230 215 236" fill="none" stroke="#2d1c24" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
