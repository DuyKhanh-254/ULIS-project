<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#90d9ef"><meta name="color-scheme" content="light"><title>TEAM-CRAFT Simulator | Bản chạy trực tiếp (standalone)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet"><style>
:root{
  font-family:'Nunito','Segoe UI',Arial,sans-serif;
  color:#353747;background:#badde8;font-synthesis:none;
  --ink:#353747;--navy:#344b64;--muted:#69788c;--blue:#53b9ea;--cream:#fff9eb;
  --font-display:'Baloo 2','Nunito','Segoe UI',Arial,sans-serif;
}
/* 'Arial Rounded MT Bold'/'Trebuchet MS' (font cũ) không có đủ bộ dấu tiếng Việt,
   gây lỗi dấu khi hiển thị — thay bằng Baloo 2 (tiêu đề/nút, vẫn tròn trịa, vui mắt)
   và Nunito (đoạn văn dài, rõ chữ), cả hai đều hỗ trợ đầy đủ tiếng Việt. */
h1,h2,.brand,.brand-sm,.game-btn,.decision-choice,.answer,.level-copy b,.stage-text b,
.ending-title,.coming-title,.logo-mark,.role-tile b,.outfit-item span,
.lesson-caption,.id-card-title,.id-handle,.id-stamp span{font-family:var(--font-display)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;min-height:100vh;overscroll-behavior:none;background:radial-gradient(circle at 30% -5%,#ebf8fa,transparent 38%),radial-gradient(circle at 100% 100%,#f7e0cf,transparent 35%),#b9dce8}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:3px solid #2674dd;outline-offset:3px}
a,[role="button"]{touch-action:manipulation}
#app{display:flex;justify-content:center;min-height:100vh}
.device{width:min(100%,430px);min-height:100dvh;background:var(--cream);position:relative;box-shadow:0 0 0 7px #ffffff55,0 22px 65px #526a7940;overflow:hidden}
.page{position:relative;min-height:100dvh;overflow:hidden}
.icon{width:26px;height:26px;object-fit:contain;display:inline-block;vertical-align:middle;pointer-events:none}
.character{object-fit:contain;display:block;filter:drop-shadow(0 6px 0 #304b6133);pointer-events:none}
/* Viền chữ logo dùng nhiều lớp text-shadow xếp vòng tròn thay cho
   -webkit-text-stroke (thuộc tính không chuẩn, render khác nhau giữa các
   trình duyệt/thiết bị — có thể vỡ viền trên Android WebView, Firefox...).
   text-shadow render giống hệt nhau trên mọi trình duyệt. */
.brand{font-size:62px;line-height:.92;letter-spacing:0;font-weight:800;display:inline-flex;flex-direction:column;transform:rotate(-4deg);color:#ffdb65;filter:drop-shadow(3px 6px 0 #29334b);text-align:center}
.brand span{display:block;text-shadow:1px 0 0 #29334b,-1px 0 0 #29334b,0 1px 0 #29334b,0 -1px 0 #29334b,1px 1px 0 #29334b,-1px 1px 0 #29334b,1px -1px 0 #29334b,-1px -1px 0 #29334b,2px 0 0 #29334b,-2px 0 0 #29334b,0 2px 0 #29334b,0 -2px 0 #29334b,2px 2px 0 #29334b,-2px 2px 0 #29334b,2px -2px 0 #29334b,-2px -2px 0 #29334b,2px 3px 0 #dd8f3d,0 -2px 0 #ffefa1}
.brand span:last-child{color:#f67d52;text-shadow:1px 0 0 #29334b,-1px 0 0 #29334b,0 1px 0 #29334b,0 -1px 0 #29334b,1px 1px 0 #29334b,-1px 1px 0 #29334b,1px -1px 0 #29334b,-1px -1px 0 #29334b,2px 0 0 #29334b,-2px 0 0 #29334b,0 2px 0 #29334b,0 -2px 0 #29334b,2px 2px 0 #29334b,-2px 2px 0 #29334b,2px -2px 0 #29334b,-2px -2px 0 #29334b,2px 3px 0 #c64c41,0 -2px 0 #ffab7b}
.brand-sm{font-size:31px;letter-spacing:0;filter:drop-shadow(1px 3px 0 #29334b)}
.brand-sm span{text-shadow:1px 0 0 #29334b,-1px 0 0 #29334b,0 1px 0 #29334b,0 -1px 0 #29334b,1px 1px 0 #29334b,-1px 1px 0 #29334b,1px -1px 0 #29334b,-1px -1px 0 #29334b,1px 2px 0 #dd8f3d}
.home-page{background:linear-gradient(180deg,#95dcf5 0%,#d6f0ef 43%,#eaf5d6 100%)}
.home-page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 25%,#fff9 0 7%,transparent 8%),radial-gradient(circle at 90% 16%,#fff7 0 8%,transparent 9%),radial-gradient(circle at 12% 74%,#96d17f66 0 17%,transparent 18%)}
.home-head{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 18px 4px}
.logo-mark{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:1000;color:#315875;letter-spacing:.4px}
.logo-mark .icon{width:22px;height:22px}
.head-action{background:#fffaf2;border:2px solid #fff;box-shadow:0 4px 0 #4d7b8a33;border-radius:18px;padding:7px 10px;font-weight:900;font-size:11px;color:#496576;display:flex;align-items:center;gap:3px}
.head-action .icon{width:22px;height:22px}
.home-head-right{display:flex;gap:7px}
.home-hero{position:relative;text-align:center;padding:12px 17px 0;z-index:1}
.home-ribbon{display:inline-block;background:#fff6d9;border:2px solid #e8ca8b;border-radius:99px;color:#92703b;padding:8px 12px;font-size:10.5px;letter-spacing:.45px;font-weight:1000;box-shadow:0 4px 0 #d4ab7633;margin:5px auto 18px}
.hero-tagline{margin:17px 0 6px;font-weight:1000;color:#48687c;font-size:15px}
.character-group{height:246px;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 0}
.character-group:before{content:"";position:absolute;width:320px;height:107px;border-radius:50%;bottom:2px;background:linear-gradient(#9ed67b,#77ba67);border:4px solid #7dbb62;box-shadow:0 10px 0 #6ca75c66}
.podium{position:absolute;width:140px;height:38px;background:#e6c5a5;bottom:24px;border-radius:50%;opacity:.7}
.podium-left{left:7%}.podium-right{right:7%}
.home-person{position:absolute;bottom:9px;z-index:2}
.home-person.left{width:130px;left:12%;bottom:8px;transform:rotate(-7deg)}
.home-person.lead{width:174px;left:50%;transform:translateX(-50%);z-index:3;bottom:10px}
.home-person.right{width:130px;right:12%;bottom:9px;transform:rotate(7deg)}
.talk-label{display:inline-block;position:relative;top:-11px;background:#fffef9;border:2px solid #cde4c7;color:#59705e;padding:9px 14px;border-radius:14px;box-shadow:0 4px 0 #a9c799;font-size:12px;font-weight:900}
.home-cta{position:relative;z-index:2;margin:7px 25px 0;display:grid;gap:12px}
.game-btn{appearance:none;min-height:48px;padding:10px 12px;border-radius:15px;border:3px solid transparent;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-size:13px;font-weight:1000;line-height:1.2;transition:transform .12s ease-out,filter .12s ease-out,box-shadow .12s ease-out;box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #3a41485b}
@media (hover:hover) and (pointer:fine){.game-btn:hover{filter:brightness(1.04)}}
.game-btn:active{transform:translateY(3px) scale(.98);box-shadow:inset 0 2px 0 #ffffff80,0 2px 0 #3a41485b}
.game-btn.green{background:linear-gradient(#83e767,#44b93b);border-color:#287d38;color:white;text-shadow:0 2px 0 #267238}
.game-btn.sky{background:linear-gradient(#91dcfa,#4aa8e8);border-color:#3985ba;color:white;text-shadow:0 2px 0 #3978a5}
.game-btn.pale{background:linear-gradient(#fff8e9,#ffe1aa);border-color:#e7b16a;color:#825b31;text-shadow:0 1px 0 #fff}
.game-btn.full{width:100%}.game-btn.large{height:56px;font-size:16px}
.game-btn .icon{width:28px;height:28px}
.home-feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 20px 7px;position:relative;z-index:2}
.home-feature-strip>div{padding:8px 6px;border-radius:14px;background:#fffaf7cb;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #fff;box-shadow:0 3px 0 #bdd5c8;font-size:10px;font-weight:1000;color:#64736c}
.home-feature-strip .icon{width:33px;height:33px}
.footer-note{text-align:center;color:#73948e;font-size:10px;margin:12px 20px 20px;font-weight:800}
/* Map: one new illustration, individual NPC sprites, deliberately NO old map raster overdraw */
.map-page{height:100dvh;min-height:650px;background:#9ad875}
.map-scene{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.map-page:after{content:"";position:absolute;pointer-events:none;left:0;right:0;bottom:0;height:125px;background:linear-gradient(transparent,#3d607c26);z-index:1}
.map-hud{position:absolute;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;gap:12px}
.map-hud-left{display:flex;align-items:center;gap:8px}
.map-logo{border:0;background:none;padding:5px 0 0}
.resources{display:flex;align-items:center;gap:5px;background:#344e61dd;border:2px solid #ffffff9a;padding:3px 7px;border-radius:999px;box-shadow:0 4px 0 #3e526d3d;color:#fff;font-size:12px;font-weight:1000;white-space:nowrap}
.resources span{display:flex;align-items:center;gap:1px}.resources span+span{margin-left:5px}
.resources .icon{width:28px;height:28px}
.map-npc{position:absolute;z-index:2;transform:translate(-50%,-50%);width:69px;filter:drop-shadow(0 4px 2px #35594d44)}
.map-npc.kid-a{width:62px}.map-npc.kid-b{width:68px}.map-npc.kid-c{width:71px}.map-npc.kid-d{width:68px}.map-npc.kid-e{width:71px}
.level-spot{position:absolute;transform:translate(-50%,-50%);z-index:4;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;width:154px;min-height:104px}
.level-orb{position:relative;width:62px;height:59px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;border:5px solid #fff5e6;box-shadow:0 0 0 3px #3b49569f,0 5px 0 #41455666, inset 0 7px 10px #fff7;background:linear-gradient(#b4ef7c,#3cc33a)}
.level-orb .icon{width:40px;height:40px;filter:drop-shadow(0 2px 0 #27354c44)}
.level-spot.blue .level-orb{background:linear-gradient(#b3ecff,#279ed9)}
.level-spot.orange .level-orb{background:linear-gradient(#ffe3a0,#f2a02a)}
.level-spot.danger .level-orb{background:linear-gradient(#ffb0aa,#ec5f65)}
.level-spot.boss .level-orb{background:linear-gradient(#ebecf1,#777d8f)}
/* Giữ màu sắc rực rỡ cho mọi Ải kể cả chưa mở — chỉ làm mờ nhẹ phần chữ phụ,
   không phủ xám cả node (đúng tinh thần bản đồ "mời gọi khám phá" thay vì "khóa cứng"). */
.level-spot.is-locked .level-copy small{color:#eef3e0cc}
.lock-badge{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#48566b;border:3px solid #fff;display:grid;place-items:center;box-shadow:0 2px 0 #2c384766}
.lock-badge .icon{width:13px;height:13px;filter:brightness(0) invert(1);margin:0}
.level-spot.is-unlocked{filter:none;opacity:1;cursor:pointer}
@media (hover:hover) and (pointer:fine){.level-spot.is-unlocked:hover .level-orb{transform:scale(1.06)}}
.level-spot.is-unlocked:active .level-orb{transform:scale(.94)}
.level-spot.is-unlocked .level-orb{transition:transform .13s ease-out}
.level-spot.is-dev.is-unlocked .level-orb{background:linear-gradient(#ffe082,#f59e0b)!important;border-color:#fff9e6;box-shadow:0 0 0 3px #b453099f,0 5px 0 #78350f66,inset 0 7px 10px #fff9;animation:pulse-dev 2.2s infinite ease-in-out}
@keyframes pulse-dev{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.level-copy{display:flex;flex-direction:column;align-items:center;margin-top:7px;text-align:center;min-height:38px;text-shadow:-1px -1px #2c405a,1px -1px #2c405a,-1px 1px #2c405a,1px 1px #2c405a,0 2px #2c405a}
.level-copy b{font-size:12px;line-height:1.18;color:#fff;max-width:144px}
.level-copy small{display:block;font-size:9px;letter-spacing:.4px;font-weight:1000;color:#fff6da;margin-top:2px}
.level-copy small.coming-badge{color:#ffea79!important;text-shadow:0 1px 3px #000;font-weight:1000;letter-spacing:.5px}

/* Coming Soon Screen */
.coming-soon-card{text-align:center;padding:22px 18px;margin-top:10px;background:#fffdf8;border:2px solid #ecdac6;border-radius:20px;box-shadow:0 5px 0 #dec6ae}
.coming-badge-tag{display:inline-flex;align-items:center;gap:6px;background:#fff3cc;color:#b45309;font-size:11px;font-weight:900;padding:5px 14px;border-radius:999px;border:1.5px solid #fcd34d;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.coming-badge-tag .icon{width:16px;height:16px}
.coming-title{font-size:20px;color:#2b394a;margin:6px 0 12px;text-align:center;font-weight:900}
.coming-highlight-icon{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#fef3c7,#fde68a);display:grid;place-items:center;box-shadow:0 4px 0 #f59e0b44}
.coming-highlight-icon .icon{width:30px;height:30px}
.coming-message{font-size:15px;line-height:1.45;color:#92400e;margin-bottom:10px}
.coming-subtext{font-size:13px;line-height:1.5;color:#64748b;margin-bottom:14px}
.coming-info-box{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:12px;padding:11px 14px;font-size:12px;line-height:1.6;color:#475569;text-align:left}
.coming-info-box div+div{margin-top:5px}
.map-dock{position:absolute;left:15px;right:15px;bottom:calc(15px + env(safe-area-inset-bottom));z-index:7;display:grid;grid-template-columns:82px 1fr 82px;gap:8px;align-items:end}
.map-dock button{border:3px solid #fff8df;border-radius:16px;box-shadow:0 4px 0 #36536e,0 7px 8px #395e7845;color:#fff;font-weight:1000}
.map-dock .dock-small{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#89d7f8,#419fd2);min-height:61px;font-size:11px;text-shadow:0 1px 0 #3d718c}
.map-dock .dock-small .icon{height:26px;width:26px}
.map-dock .dock-play{min-height:67px;background:linear-gradient(#8aee69,#30bc35);border-color:#fff8d2;display:flex;align-items:center;justify-content:center;gap:2px;font-size:16px;text-shadow:0 2px 0 #2a7a3a}
.map-dock .dock-play .icon{height:31px;width:31px}
/* Interior */
.interior-page{background:radial-gradient(circle at 95% 4%,#e2f6d2 0 14%,transparent 15%),linear-gradient(180deg,#c5eaf7,#f7f6de 49%,#fff8ec)}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 6px}
.page-top h1{font-size:20px;text-align:center;line-height:1.2;margin:0;color:#344b64;font-weight:1000}
.page-top-spacer{width:41px;height:41px}
.circle-action{width:41px;height:41px;padding:3px;border:2px solid #73abc3;background:#eaf9ff;border-radius:50%;box-shadow:0 4px 0 #6c8c9d5a;transition:transform .12s ease-out,filter .12s}
@media (hover:hover) and (pointer:fine){.circle-action:hover{filter:brightness(1.05)}}
.circle-action:active{transform:translateY(2px) scale(.95);box-shadow:0 2px 0 #6c8c9d5a}
.circle-action .icon{width:33px;height:33px}
.page-body{padding:13px 19px 28px;display:grid;gap:14px;position:relative}
.page-intro{background:#fffdf4;border:2px solid #e8dabd;border-radius:15px;padding:12px 14px;font-size:13px;font-weight:800;color:#6c6a69;text-align:center}
.role-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.role-tile{grid-column:span 2;position:relative;min-height:162px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#dff4ff,#fffef4);box-shadow:0 4px 0 #adc6cf;display:flex;flex-direction:column;align-items:center;padding:4px 5px 8px;color:#36455b}
.role-tile:nth-child(2){background:linear-gradient(#ffe1ec,#fffef4)}.role-tile:nth-child(3){background:linear-gradient(#dbfbef,#fffef4)}.role-tile:nth-child(4){grid-column:2/span 2;background:linear-gradient(#f2e8ff,#fffef4)}.role-tile:nth-child(5){grid-column:4/span 2;background:linear-gradient(#fff1cf,#fffef4)}
.role-tile{transition:transform .1s ease-out}
.role-tile.active{outline:3px solid #4cca74;transform:translateY(-3px);box-shadow:0 7px 0 #75b69a}
.role-tile:active{transform:scale(.97)}
.role-figure{height:106px;display:flex;align-items:flex-end;justify-content:center}.role-char{width:91px;height:112px;object-fit:contain}
.role-tile b{font-size:11px;line-height:1.15;text-align:center}.role-tile small{font-size:9px;color:#798797;font-weight:900;margin-top:3px}
.checkmark{position:absolute;right:-6px;top:-8px}.checkmark .icon{width:27px;height:27px}
.role-summary{border:2px solid #e0dabf;border-radius:17px;background:#fffdf1;display:grid;grid-template-columns:75px 1fr;gap:12px;align-items:center;padding:8px 12px}
.role-portrait{height:81px}.portrait-char{width:74px;height:84px}.role-summary strong{color:#385b74;font-size:16px}.role-summary p{color:#6b7282;font-size:12px;line-height:1.45;margin:6px 0 0}
.button-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.button-pair .game-btn{font-size:12px}
.preview-stage{height:288px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:radial-gradient(ellipse at 50% 80%,#a5d3b8 0 36%,transparent 37%),linear-gradient(#bceeff,#eafae5);border-radius:22px;border:3px solid #fff;box-shadow:0 5px 0 #a4bbad}
.preview-stage.small{height:200px}
.preview-ring{position:absolute;width:165px;height:47px;bottom:34px;border-radius:50%;background:#8abd79;box-shadow:inset 0 -7px 0 #73a367}
.preview-character{width:191px;max-height:244px;position:relative;z-index:2}
.preview-stage.small .preview-character{width:150px}
.preview-name{position:absolute;z-index:3;bottom:10px;background:#fff;border:2px solid #d6dabf;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:900}
.subheading{font-size:17px;margin:3px 0 0}
.outfit-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.outfit-item{min-width:0;border:2px solid #e4d6c4;border-radius:13px;background:#fff;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 #c5c5b5}
.outfit-item{position:relative;transition:transform .1s ease-out}.outfit-item.active{outline:2px solid #49c66a}.outfit-item:active{transform:scale(.95)}.outfit-item img{width:52px;height:70px}.outfit-item span{font-size:9px;line-height:1.2;font-weight:900;color:#576779}
.outfit-item.is-locked{background:#f3f1ec}.outfit-item.is-locked img{filter:grayscale(.6) brightness(.92);opacity:.75}
.outfit-price{display:flex;align-items:center;gap:2px;font-size:9px;font-weight:1000;color:#b9790f;background:#fff3d9;border:1.5px solid #f3d089;border-radius:99px;padding:1px 6px}
.outfit-price .icon{width:12px;height:12px}
/* Shop */
.shop-balance{display:flex;align-items:center;gap:6px;justify-content:center;background:#fff6df;border:2px solid #f0d28b;border-radius:14px;padding:10px;font-size:14px;font-weight:1000;color:#8a6414}
.shop-balance .icon{width:24px;height:24px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.shop-item{background:#fffcf5;border:2px solid #e4d8c9;border-radius:16px;box-shadow:0 4px 0 #dbd0c2;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shop-item-img{width:100%;height:84px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#eef6ff,#f6fbe9);border-radius:12px}
.shop-item-img img{width:62px;height:80px;object-fit:contain}
.shop-item b{font-size:11.5px;color:#3a4a5c;line-height:1.2;min-height:28px;display:flex;align-items:center}
.shop-buy{display:flex;align-items:center;gap:4px;border:2px solid #f3c969;background:linear-gradient(#ffe9ad,#ffce5c);color:#7a5412;font-weight:1000;font-size:12px;border-radius:12px;padding:7px 14px;box-shadow:0 3px 0 #d6a23e;width:100%;justify-content:center}
.shop-buy .icon{width:16px;height:16px}
.shop-buy.is-disabled{opacity:.5;filter:grayscale(.3)}
.shop-tag{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:1000;color:#3c9a5c;background:#e9f9ee;border:1.5px solid #bdeccb;border-radius:99px;padding:5px 10px}
.shop-tag .icon{width:14px;height:14px}

.quiz-page{background:linear-gradient(#ffe6f0,#fff5eb 75%,#f6f9e5)}

/* Thẻ kết quả kiểu ID/giấy phép vui nhộn (tham khảo "Cool Frog License"):
   nền hồng pastel caro mờ, sao lấp lánh, khung ảnh đại diện, mã định danh,

.id-card{position:relative;overflow:hidden;border-radius:26px;background-color:#ffe3ef;background-image:linear-gradient(#f6c9dc88 1px,transparent 1px),linear-gradient(90deg,#f6c9dc88 1px,transparent 1px);background-size:22px 22px;padding:18px 16px 16px;box-shadow:0 8px 0 #d98cb2,0 0 0 3px #ffb8d4 inset}

.id-star .icon{width:16px;height:16px}

.id-star.s2{top:20px;right:54px;width:12px}
.id-star.s2 .icon{width:11px;height:11px}
.id-star.s3{bottom:72px;left:20px;transform:rotate(14deg)}
.id-card-title{font-size:17px;text-align:center;color:#a8356f;letter-spacing:.3px;margin:2px 36px 14px;line-height:1.25}
.id-card-body{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.id-photo{background:#fff;border-radius:14px;padding:5px;transform:rotate(-3deg);box-shadow:0 3px 0 #e3aec2,0 0 0 1.5px #f3c7d9}
.id-photo-frame{background:linear-gradient(#ffeef5,#ffd9e8);border-radius:10px;height:92px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.id-photo-char{width:76px}
.id-info{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.id-info small{font-size:9px;font-weight:1000;letter-spacing:.6px;color:#c285a3;margin-top:6px}
.id-info small:first-child{margin-top:0}
.id-handle{font-size:14px;font-weight:800;color:#7a3457;letter-spacing:.4px}
.id-team{font-size:11px;color:#92617a;font-weight:700}
.id-desc{font-size:12.5px;color:#7f5e71;line-height:1.55;margin:12px 2px 10px;border-top:2px dashed #f0b9d0;padding:10px 86px 0 0}
.id-card-foot{font-size:9px;font-weight:1000;color:#b47b9e;text-align:center;letter-spacing:.3px;margin-bottom:2px}
.id-stamp{position:absolute;right:10px;bottom:10px;width:68px;height:68px;border-radius:50%;border:2.5px solid #d14b6a;color:#d14b6a;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);opacity:.82;background:#fff2f5}
.id-stamp span{font-size:9px;font-weight:800;line-height:1.05;text-align:center}
.id-stamp small{font-size:5.6px;font-weight:1000;letter-spacing:.3px;margin-top:2px}
.persona-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.persona-actions .game-btn{font-size:12px;min-height:44px}
/* Thẻ "Hoàn thành Ải" — hiện sau khi chơi xong hết các màn của 1 Ải, có thể tải/chia sẻ */
/* Thẻ "Hoàn thành Ải" dùng chung khung ID card với thẻ Quiz, chỉ đổi tông màu xanh lá */
.id-card.theme-green{background-color:#eafbe6;border:3px solid #bfeec0;box-shadow:0 8px 0 #7dbf7e,0 0 0 3px #cdeec5 inset;background-image:linear-gradient(#cdeec5aa 1px,transparent 1px),linear-gradient(90deg,#cdeec5aa 1px,transparent 1px)}

.id-card.theme-green .id-info small{color:#6fa374}
.id-card.theme-green .id-handle{color:#2f6b3f}
.id-card.theme-green .id-team{color:#4d8a55}
.id-card.theme-green .id-desc{color:#4d6b52;border-top-color:#bfeec0}
.id-card.theme-green .id-card-foot{color:#5f9a68}

.id-desc .icon{width:15px;height:15px;margin:0 1px;vertical-align:-3px}
/* Chat */
/* Round-table conversation screen (nhân vật ngồi bàn tròn, nói trực tiếp) */
.rt-page{height:100dvh;min-height:690px;display:flex;flex-direction:column}
.rt-scene{position:relative;flex:1;overflow:hidden;transition:filter .3s ease}
.rt-scene.rt-dimmed{filter:brightness(.8) saturate(.85)}
.rt-table{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:78%;max-width:300px;height:92px;background:radial-gradient(ellipse at 40% 30%,#e3b98f,#bd895b);border:3px solid #8a5c38;border-radius:50%;box-shadow:0 10px 0 #7c533c40}
.rt-seat{position:absolute;display:flex;flex-direction:column;align-items:center;width:84px;transition:transform .25s cubic-bezier(.22,1,.36,1),filter .25s ease;filter:brightness(.93)}
.rt-seat-glow{position:absolute;top:4px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#fff6c4cc,transparent 70%);opacity:0;transition:opacity .25s ease}
.rt-seat-char{width:64px;position:relative;z-index:1}
.rt-seat-tag{margin-top:-6px;position:relative;z-index:1;background:#fffaf2;border:2px solid #7c533c88;border-radius:99px;padding:2px 9px;font-size:9.5px;font-weight:1000;color:#4a3228;white-space:nowrap}
.rt-seat.is-speaking{transform:scale(1.12) translateY(-4px);filter:brightness(1)}
.rt-seat.is-speaking .rt-seat-glow{opacity:1}
.rt-seat.is-speaking .rt-seat-tag{background:linear-gradient(#fff3c4,#ffd97d);border-color:#c9972f}
.rt-bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:88%;max-width:340px;background:#fff9ee;border:2.5px solid #7c533c;border-radius:16px;padding:10px 14px;box-shadow:0 5px 0 #7c533c3a,0 10px 18px #3a25221f;cursor:pointer;animation:rtBubbleIn .22s cubic-bezier(.22,1,.36,1) both}
@keyframes rtBubbleIn{0%{transform:translateX(-50%) translateY(-8px) scale(.96);opacity:0}100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
.rt-bubble small{display:block;font-weight:1000;color:#8c674f;font-size:10px;margin-bottom:3px}
.rt-bubble p{margin:0;font-size:13px;font-weight:700;color:#4a3228;line-height:1.4}
.rt-next-btn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:linear-gradient(#fff6df,#f5d393);border:2.5px solid #7c533c;border-radius:999px;padding:9px 18px;font-size:12.5px;font-weight:1000;color:#4a3228;box-shadow:0 4px 0 #7c533c}
.rt-next-btn .icon{width:18px;height:18px}
.rt-next-btn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #7c533c}
.rt-decision{position:absolute;left:0;right:0;bottom:0;background:#fffef9;border-top:2px solid #d7e9d5;padding:14px 14px calc(17px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -6px 25px #356a4842;animation:slideUpSoft .22s cubic-bezier(.22,1,.36,1) both}
@keyframes slideUpSoft{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Hiệu ứng "chụp khoảnh khắc" khi vừa vào màn kết quả */
.cam-flash{position:absolute;inset:0;background:#fff;z-index:95;pointer-events:none;animation:camFlash .55s ease-out forwards}
@keyframes camFlash{0%{opacity:.92}100%{opacity:0}}

.chat-page{height:100dvh;min-height:690px;display:flex;flex-direction:column;background:#eff8f1}
.chat-head{height:75px;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fffef7;border-bottom:2px solid #dcecd9;flex-shrink:0}
.chat-head .circle-action{width:36px;height:36px;flex-shrink:0}.chat-head .circle-action .icon{width:28px;height:28px}
.chat-head-face{width:44px;height:44px;background:#d8efec;border-radius:13px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.chat-head-face .character{width:47px;height:55px}
.chat-head-text{flex:1;min-width:0}.chat-head-text strong{font-size:13px;line-height:1.2;display:block}.chat-head-text small{font-size:11px;color:#738b85}
.timer{background:#ffecbd;color:#a07834;border-radius:11px;font-size:12px;font-weight:1000;padding:8px}
.message-zone{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding:15px 14px 20px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 90% 9%,#d2eddd 0 18%,transparent 19%),#eef8f1}
.privacy-note{font-size:10px;margin:0 auto 8px;color:#91a99b;font-weight:900;background:#ffffffb7;border-radius:99px;padding:6px 12px}
.bubble-row{display:flex;gap:8px;align-items:flex-start}.bubble-row.self{flex-direction:row-reverse}
.bubble-avatar{width:37px;height:38px;flex-shrink:0;background:#fff;border:1px solid #d8e6dc;border-radius:11px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.bubble-character{width:40px;height:49px}
.bubble-content{max-width:78%;display:flex;flex-direction:column;gap:4px}.bubble-content small{font-size:10px;color:#779083;font-weight:1000}.bubble-content p{margin:0;padding:10px 12px;border-radius:5px 14px 14px 14px;background:#fff;border:1px solid #d2e1d4;font-size:12px;font-weight:750;line-height:1.55;box-shadow:0 3px 0 #d5e6d8}.self .bubble-content p{background:#d6f3d7;border-radius:14px 5px 14px 14px}
.decision-box{flex-shrink:0;background:#fffef9;border-top:2px solid #d7e9d5;padding:14px 14px calc(17px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -6px 25px #356a4842}
.decision-head{display:flex;justify-content:space-between;gap:6px;align-items:flex-end}.decision-head b{font-size:14px;line-height:1.3}.decision-head small{font-size:9px;white-space:nowrap;color:#8a988f;font-weight:1000}
.time-track{height:6px;background:#e8e9dd;border-radius:99px;overflow:hidden;margin:11px 0}.time-track span{height:100%;display:block;background:linear-gradient(90deg,#5bbfe4,#8ed768)}
.decision-choice{width:100%;margin-top:7px;padding:9px 10px}
/* Endings */
.ending-page{background:linear-gradient(#a9e1f4,#eef8df 60%,#fff8ea)}
.ending-medal{position:relative;width:145px;height:148px;display:grid;place-items:center;margin:0 auto 4px;background:linear-gradient(#fdf5c1,#f8ce69);border:6px solid white;box-shadow:0 7px 0 #d3a658;border-radius:50%}
.ending-medal.bad{background:linear-gradient(#ffe8db,#f7adab)}.ending-medal.mid{background:linear-gradient(#f1e9ff,#d0c1ee)}
.mood-badge{position:absolute;right:2px;bottom:10px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));animation:moodPop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes moodPop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.medal-character{width:105px}.ending-title{text-align:center;font-size:24px;line-height:1.2;margin:3px}.ending-desc{font-size:13px;line-height:1.55;text-align:center;color:#6e7080;margin:0 0 6px;white-space:pre-line}
.lesson-caption{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:1000;color:#9b7b4a}.lesson-caption .icon{width:26px}
.template-card strong{font-size:12px;color:#69916b}
.small-button{border:2px solid #a9d7b2;border-radius:11px;background:#eff9ed;color:#4c8860;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;font-size:12px;font-weight:900;margin-top:9px}.small-button .icon{width:22px;height:22px}
.action-stack{display:grid;gap:10px}
.empty-wallet{text-align:center;padding:20px;background:#fffcf4;border:2px dashed #decfb5;border-radius:20px}.empty-char{width:110px;margin:0 auto}.empty-wallet h2{font-size:17px}.empty-wallet p{font-size:12px;color:#6f7c86}
.wallet-item strong{color:#5d8a72}
.toast{position:fixed;left:50%;top:calc(136px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;visibility:hidden;pointer-events:none;background:#3c4250;color:white;padding:11px 16px;border-radius:15px;font-weight:900;font-size:13px;z-index:60;box-shadow:0 6px 15px #24364944;transition:transform .18s ease-out,opacity .18s ease-out,visibility 0s linear .18s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .18s ease-out,opacity .18s ease-out,visibility 0s linear}
.toast.reward{background:#2f9e54;box-shadow:0 6px 15px #1f6b3844,inset 0 0 0 2px #7be29c66}
.toast.reward.on{animation:toastPop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes toastPop{0%{transform:translate(-50%,-14px) scale(.75);opacity:0}55%{transform:translate(-50%,3px) scale(1.08);opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:1}}

/* ==========================================================================
   V5 UPGRADE STYLES: CHARACTER SELECTION, ROUNDTABLE, POLAROID & SCRAPBOOK
   ========================================================================== */

/* 1. Màn hình chọn nhân vật (Nam, Nữ, Mascot Cute) */
.char-select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.char-select-tile{background:#fffdf6;border:2.5px solid #d9cbbe;border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 4px 0 #cfc0b3;position:relative;transition:transform .12s ease-out,border-color .12s,box-shadow .12s}
.char-select-tile.active{border-color:#4cca74;outline:3px solid #4cca74;background:#f3fcf4;transform:translateY(-2px);box-shadow:0 6px 0 #7dbf90}
.char-select-figure{height:95px;display:flex;align-items:flex-end;justify-content:center}
.char-select-figure img{width:76px;height:92px;object-fit:contain}
.char-select-tile b{font-size:12px;color:#354456;margin-top:4px}
.char-select-tile small{font-size:9.5px;color:#788696;line-height:1.3;margin-top:2px}

/* 2. Giao diện Bàn Tròn Nâng Cấp V5 (Campus & Quán Nước Ấm Áp) */
.rt-v5-scene{position:relative;width:100%;height:100%;background:#f9eedc;overflow:hidden}
.rt-head-v5{position:absolute;top:10px;left:12px;right:12px;z-index:60;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.rt-head-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,249,238,0.96);border:2px solid #7c533c;color:#4a3228;font-size:11.5px;font-weight:800;box-shadow:0 2px 4px rgba(74,50,40,0.2);pointer-events:auto}
.rt-head-dot{width:9px;height:9px;border-radius:50%;background:#de6e4b;border:1.5px solid #7c533c}
.rt-head-heart{font-size:12px;line-height:1}

.rt-backdrop-wrap{position:absolute;inset:0;pointer-events:none;z-index:1}
.rt-backdrop-wrap svg{width:100%;height:100%;object-fit:cover}

.rt-chars-wrap{position:absolute;inset:0;z-index:10;pointer-events:none}

.character-seat{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:transform .32s cubic-bezier(.22,1,.36,1),filter .32s ease}
.character-art{transform-origin:center bottom;animation:gentleBreathing 3.6s ease-in-out infinite;transition:filter .3s ease}
#seat-Doer .character-art{animation-delay:0s}
#seat-Leader .character-art{animation-delay:.7s}
#seat-QC .character-art{animation-delay:1.4s}
#seat-Mediator .character-art{animation-delay:2.1s}
#seat-BanThan .character-art{animation-delay:2.8s}

.character-seat.is-dimmed{filter:brightness(.91) saturate(.9);transform:scale(.985)}
.character-seat.is-speaking{filter:brightness(1.04) saturate(1.05);transform:translateY(-4px) scale(1.035)}
.character-seat.is-speaking .character-art{filter:drop-shadow(0 0 12px rgba(255,224,130,0.85))}

.char-badge{margin-top:-8px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.01em;background:rgba(255,249,238,0.94);border:2px solid #7c533c;color:#4a3228;box-shadow:0 2px 4px rgba(74,50,40,0.2);white-space:nowrap;transition:all .25s ease}
.character-seat.is-speaking .char-badge{background:linear-gradient(180deg,#fff3c4 0%,#ffd97d 100%);border-color:#8f5629;color:#472810;transform:scale(1.06)}

.eye-group{transform-box:fill-box;transform-origin:center center;animation:animeBlink 4.8s infinite}
#seat-Doer .eye-group{animation-delay:1.1s}
#seat-Leader .eye-group{animation-delay:2.4s}
#seat-QC .eye-group{animation-delay:.4s}
#seat-Mediator .eye-group{animation-delay:3.3s}
#seat-BanThan .eye-group{animation-delay:1.9s}

@keyframes animeBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes gentleBreathing{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}

/* Floating Overhead Speech Bubble */

let mouthTimer = null;

function startMouthFlap(speakerKey) {
  stopMouthFlap();
  const seat = document.getElementById(`seat-${speakerKey}`);
  if (!seat) return;
  const mouth = seat.querySelector('.char-mouth');
  if (!mouth) return;

  const coords = {
    Leader: { mx: 58, my: 63 },
    QC:     { mx: 58, my: 63 },
    Doer:   { mx: 58, my: 61 },
    Mediator:{ mx: 55.5, my: 61 },
    BanThan:{ mx: 54.5, my: 56 }
  }[speakerKey] || { mx: 58, my: 63 };

  let isOpen = false;
  mouthTimer = setInterval(() => {
    isOpen = !isOpen;
    if (isOpen) {
      mouth.setAttribute(
        'd',
        `M${coords.mx - 4.5} ${coords.my} Q${coords.mx} ${coords.my + 6.5} ${coords.mx + 4.5} ${coords.my} Q${coords.mx} ${coords.my + 1.5} ${coords.mx - 4.5} ${coords.my}`
      );
      mouth.setAttribute('fill', '#8a2b24');
    } else {
      mouth.setAttribute(
        'd',
        `M${coords.mx - 4.5} ${coords.my + 1} Q${coords.mx} ${coords.my + 2.5} ${coords.mx + 4.5} ${coords.my + 1}`
      );
      mouth.setAttribute('fill', 'none');
    }
  }, 130);
}

function stopMouthFlap() {
  if (mouthTimer) {
    clearInterval(mouthTimer);
    mouthTimer = null;
  }
}

function focusRoundtableSpeaker(speakerKey) {
  ['Leader', 'QC', 'Doer', 'Mediator', 'BanThan'].forEach(key => {
    const seat = document.getElementById(`seat-${key}`);
    if (!seat) return;
    if (!speakerKey) {
      seat.classList.remove('is-speaking', 'is-dimmed');
    } else if (key === speakerKey) {
      seat.classList.add('is-speaking');
      seat.classList.remove('is-dimmed');
    } else {
      seat.classList.remove('is-speaking');
      seat.classList.add('is-dimmed');
    }
  });
}

function applyRoundtableExpressions(expMap) {
  if (!expMap) return;
  Object.entries(expMap).forEach(([charKey, mood]) => {
    const seat = document.getElementById(`seat-${charKey}`);
    if (!seat) return;
    const browL = seat.querySelector('.brow-left');
    const browR = seat.querySelector('.brow-right');
    const mouth = seat.querySelector('.char-mouth');
    if (!browL || !browR || !mouth) return;

    const coords = {
      Leader: { mx: 58, by: 42, my: 63 },
      QC:     { mx: 58, by: 42, my: 63 },
      Doer:   { mx: 58, by: 41, my: 61 },
      Mediator:{ mx: 55.5, by: 41, my: 61 },
      BanThan:{ mx: 54.5, by: 36, my: 56 }
    }[charKey] || { mx: 58, by: 42, my: 63 };

    const { mx, by, my } = coords;

    if (charKey === 'Leader') {
      const sweat = seat.querySelector('.leader-sweatdrop');
      if (sweat) {
        sweat.setAttribute('opacity', (mood === 'worried' || mood === 'overwhelmed') ? '1' : '0');
      }
    }

    const questionMark = seat.querySelector('.char-question');
    if (questionMark) {
      questionMark.setAttribute('opacity', mood === 'confused' ? '1' : '0');
    }

    mouth.setAttribute('fill', 'none');

    if (mood === 'happy') {
      browL.setAttribute('d', `M${mx - 16} ${by - 1.5} Q${mx - 11} ${by - 4.5} ${mx - 6} ${by - 1.5}`);
      browR.setAttribute('d', `M${mx + 6} ${by - 1.5} Q${mx + 11} ${by - 4.5} ${mx + 16} ${by - 1.5}`);
      mouth.setAttribute('d', `M${mx - 5.5} ${my - 1} Q${mx} ${my + 5.5} ${mx + 5.5} ${my - 1}`);
    } else if (mood === 'worried' || mood === 'overwhelmed' || mood === 'embarrassed' || mood === 'sad') {
      browL.setAttribute('d', `M${mx - 16} ${by + 1.5} Q${mx - 11} ${by - 2} ${mx - 6} ${by - 2.5}`);
      browR.setAttribute('d', `M${mx + 6} ${by - 2.5} Q${mx + 11} ${by - 2} ${mx + 16} ${by + 1.5}`);
      mouth.setAttribute('d', `M${mx - 4.5} ${my + 2.5} Q${mx} ${my - 1} ${mx + 4.5} ${my + 2.5}`);
    } else if (mood === 'confused') {
      browL.setAttribute('d', `M${mx - 16} ${by - 2.5} Q${mx - 11} ${by - 4} ${mx - 6} ${by - 1.5}`);
      browR.setAttribute('d', `M${mx + 6} ${by + 1} Q${mx + 11} ${by - 0.5} ${mx + 16} ${by + 1.5}`);
      mouth.setAttribute('d', `M${mx - 4.5} ${my + 1.5} Q${mx - 1.5} ${my - 0.5} ${mx + 1.5} ${my + 2} Q${mx + 3.5} ${my + 3} ${mx + 4.5} ${my + 1}`);
    } else if (mood === 'serious' || mood === 'thoughtful' || mood === 'angry') {
      browL.setAttribute('d', `M${mx - 16} ${by - 1} L${mx - 6} ${by + 1.2}`);
      browR.setAttribute('d', `M${mx + 6} ${by + 1.2} L${mx + 16} ${by - 1}`);
      mouth.setAttribute('d', `M${mx - 4.5} ${my + 1} L${mx + 4.5} ${my + 1}`);
    } else {
      browL.setAttribute('d', `M${mx - 16} ${by} Q${mx - 11} ${by - 2.5} ${mx - 6} ${by}`);
      browR.setAttribute('d', `M${mx + 6} ${by} Q${mx + 11} ${by - 2.5} ${mx + 16} ${by}`);
      mouth.setAttribute('d', `M${mx - 4.5} ${my} Q${mx} ${my + 3.5} ${mx + 4.5} ${my}`);
    }
  });
}

const ROOT=document.getElementById('app');
const TURN_SECONDS=60; // Nâng cấp V5: 60 giây mỗi lượt quyết định tình huống
const fmtTime=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const TOAST=document.getElementById('toast');
const STORE='teamcraft-redesign-v5';

// Tương thích ngược từ v3/v4 sang v5
let saved={};
try {
  saved=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem('teamcraft-redesign-v3')||'{}');
} catch{}

let extraUnlocked=[]; try{extraUnlocked=JSON.parse(localStorage.getItem('unlockedStages')||'[]')}catch{}
let extraLevels=[]; try{extraLevels=JSON.parse(localStorage.getItem('unlockedLevels')||'[]')}catch{}
const initialStages=Array.from(new Set(['1:0',...(saved.unlockedStages||[]),...(Array.isArray(extraUnlocked)?extraUnlocked:[])]));
const initialLevels=Array.from(new Set([1,...(saved.unlockedLevels||[]),...(Array.isArray(extraLevels)?extraLevels:[])]));
if(initialStages.includes('1:4')||(saved.done&&saved.done.some(k=>k.startsWith('1:4:')))){
  if(!initialLevels.includes(2))initialLevels.push(2);
  if(!initialStages.includes('2:0'))initialStages.push('2:0');
}
if(initialStages.includes('2:5')||(saved.done&&saved.done.some(k=>k.startsWith('2:5:')))){
  if(!initialLevels.includes(3))initialLevels.push(3);
}

// Danh sách trang phục hợp lệ V5
const VALID_OUTFITS = ['vnu','ulis','uet','ueb','sis','christmas','halloween'];
const initialOutfit = (saved.outfit && VALID_OUTFITS.includes(saved.outfit)) ? saved.outfit : 'vnu';

// State trung tâm của game V5
const state = {
  screen: saved.avatarType ? 'home' : 'charSelect', // Nếu chưa chọn nhân vật thì vào chọn trước
  avatarType: saved.avatarType || 'boy',            // boy | girl | cat | rabbit | bear | frog
  level: 1,
  stage: 0,
  role: saved.role || 'leader',
  outfit: initialOutfit,
  ownedOutfits: Array.from(new Set(['vnu', ...(Array.isArray(saved.ownedOutfits) ? saved.ownedOutfits.filter(x=>VALID_OUTFITS.includes(x)) : [])])),
  persona: saved.persona || null,
  quizAnswers: [],
  quizIndex: 0,
  quizTime: 60,
  gameTime: TURN_SECONDS,
  game: null,
  done: saved.done || [],
  wallet: saved.wallet || [],
  unlockedStages: initialStages,
  unlockedLevels: initialLevels,
  hearts: typeof saved.hearts === 'number' ? saved.hearts : 60,
  coins: typeof saved.coins === 'number' ? saved.coins : 200, // 200 xu ban đầu
  selectedReaction: null,
  rtTypingTimer: null
};

let clock = null;

const safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const role=id=>roles.find(r=>r.id===id)||roles[0];
const level=id=>levels.find(l=>l.id===Number(id))||levels[0];

function save(){
  try{
    const payload = {
      avatarType: state.avatarType,
      role: state.role,
      outfit: state.outfit,
      persona: state.persona,
      done: state.done,
      wallet: state.wallet,
      unlockedStages: state.unlockedStages,
      unlockedLevels: state.unlockedLevels,
      hearts: state.hearts,
      coins: state.coins,
      ownedOutfits: state.ownedOutfits
    };
    localStorage.setItem(STORE, JSON.stringify(payload));
    localStorage.setItem('unlockedStages', JSON.stringify(state.unlockedStages));
    localStorage.setItem('unlockedLevels', JSON.stringify(state.unlockedLevels));
  }catch{}
}

const HEART_DELTA={good:8,mid:2,bad:-6};
function applyReward(type,coinGain){
  const delta=HEART_DELTA[type]||0;
  state.hearts=Math.max(0,Math.min(100,state.hearts+delta));
  state.coins+=coinGain;
  save();
  const bits=[];
  if(delta)bits.push(`${delta>0?'+':''}${delta} Thấu cảm`);
  if(coinGain)bits.push(`+${coinGain} xu`);
  if(bits.length)toast(bits.join(' • '),true);
}

const isLevelUnlocked=lvlId=>{const n=Number(lvlId);return n===1||state.unlockedLevels.includes(n)};
const isStageUnlocked=(lvlId,stgIdx)=>{if(!isLevelUnlocked(lvlId))return false;if(stgIdx===0)return true;return state.unlockedStages.includes(`${lvlId}:${stgIdx}`)};
function unlockLevel(lvlId){const n=Number(lvlId);if(!state.unlockedLevels.includes(n)){state.unlockedLevels.push(n)}unlockStage(n,0);save()}
function unlockStage(lvlId,stgIdx){const key=`${lvlId}:${stgIdx}`;if(!state.unlockedStages.includes(key)){state.unlockedStages.push(key);save()}}

const icon=(name,cls='')=>`<img class="icon ${cls}" src="assets/ui/${name}.svg" alt="">`;

// Sprite resolver hỗ trợ avatarType và 10 biểu cảm:
function sprite(id, pose='idle') {
  if (id === 'player') {
    return state.avatarType === 'boy' ? `assets/characters/${state.role}_${pose}.svg` : `assets/characters/${state.avatarType}_${pose}.svg`;
  }
  return `assets/characters/${id}_${pose}.svg`;
}

function avatar(id, cl='', pose='idle') {
  return `<img class="character ${cl}" src="${sprite(id,pose)}" alt="">`;

function buyOutfit(id){
  if(state.ownedOutfits.includes(id)){
    state.outfit=id;
    save();
    toast('Đã mặc trang phục này!');
    return render();
  }
  const item=allOutfits.find(o=>o.id===id);
  if(!item)return;
  if(state.coins < item.cost){
    toast(`Thiếu Xu rồi! Cần ${item.cost} xu nhưng bạn chỉ có ${state.coins} xu. Hãy chơi thêm để tích lũy nhé!`);
    return;
  }
  state.coins -= item.cost;
  state.ownedOutfits.push(id);
  state.outfit = id;
  save();
  toast(`🎉 Đã mở khóa vĩnh viễn & mặc áo "${item.name}" (-${item.cost} xu)!`, true);
  render();
}

function currentNode(){
  const g=state.game;
  const stageKey=`${g.level}:${state.stage}`;
  if(g.mode==='reversal'){
    const r=reversals[stageKey]||reversals['1:0'];
    return {messages:r.messages, prompt:r.prompt||`${r.title} — bạn sẽ phản hồi thế nào?`, options:r.choices};
  }
  if(quickScenarios[stageKey]){
    const q=quickScenarios[stageKey];
    return {...q, prompt:q.prompt||q.title, options:q.choices};
  }
  const q=quickScenarios[`${g.level}:${g.role}`];
  return {...q, prompt:q.prompt||q.title, options:q.choices};
}

      { Leader: 'happy', Doer: 'happy', QC: 'neutral', Mediator: 'happy', BanThan: 'happy' }
    ],
    '2:2': [
      { Leader: 'confused', Doer: 'worried', QC: 'confused', Mediator: 'worried', BanThan: 'thoughtful' },
      { Leader: 'worried', Doer: 'worried', QC: 'confused', Mediator: 'worried', BanThan: 'worried' },
      { Leader: 'worried', Doer: 'worried', QC: 'worried', Mediator: 'worried', BanThan: 'worried' },
      { Leader: 'worried', Doer: 'worried', QC: 'confused', Mediator: 'worried', BanThan: 'worried' }
    ],
    '2:3': [
      { Leader: 'worried', Doer: 'serious', QC: 'worried', Mediator: 'worried', BanThan: 'worried' },
      { Leader: 'worried', Doer: 'serious', QC: 'serious', Mediator: 'worried', BanThan: 'worried' },
      { Leader: 'worried', Doer: 'serious', QC: 'serious', Mediator: 'worried', BanThan: 'worried' }
    ],
    '2:4': [
      { Leader: 'happy', Doer: 'happy', QC: 'neutral', Mediator: 'happy', BanThan: 'happy' },
      { Leader: 'worried', Doer: 'confused', QC: 'serious', Mediator: 'worried', BanThan: 'confused' },
      { Leader: 'worried', Doer: 'worried', QC: 'serious', Mediator: 'worried', BanThan: 'worried' }
    ]
  };

  if (CURATED_PDF_MOODS[stageKey] && CURATED_PDF_MOODS[stageKey][step]) {
    return CURATED_PDF_MOODS[stageKey][step];
  }

  if (!activeMsg) return { Leader: 'neutral', QC: 'neutral', Doer: 'neutral', Mediator: 'neutral', BanThan: 'neutral' };
  const speaker = (activeMsg[0] || '').toLowerCase();
  const text = (activeMsg[1] || '').toLowerCase();

  let speakerMood = 'neutral';
  let teamMood = 'neutral';

  if (text.includes('bận') || text.includes('quá tải') || text.includes('áp lực') || text.includes('ngại') || text.includes('sợ') || text.includes('lo')) {
    speakerMood = 'worried';
    teamMood = 'worried';
  } else if (text.includes('lỗi') || text.includes('chưa kỹ') || text.includes('xóa') || text.includes('soi') || text.includes('ảnh hưởng')) {
    speakerMood = 'serious';
    teamMood = 'worried';
  } else if (text.includes('hay mình') || text.includes('đồng ý') || text.includes('giải pháp') || text.includes('bình tĩnh') || text.includes('cảm ơn') || text.includes('vui')) {
    speakerMood = 'happy';
    teamMood = 'happy';
  } else if (text.includes('ai sẽ') || text.includes('chưa biết') || text.includes('thế nào') || text.includes('sao') || text.includes('nghĩ')) {
    speakerMood = 'confused';
    teamMood = 'confused';
  }

  const moods = { Leader: teamMood, QC: teamMood, Doer: teamMood, Mediator: teamMood, BanThan: teamMood };
  if (speaker.includes('leader')) moods.Leader = speakerMood;
  else if (speaker.includes('qc') || speaker === 'b') moods.QC = speakerMood;
  else if (speaker.includes('doer') || speaker === 'a') moods.Doer = speakerMood;
  else if (speaker.includes('mediator')) moods.Mediator = speakerMood;
  else if (speaker.includes('bạn thân') || speaker.includes('follower')) moods.BanThan = speakerMood;

  return moods;
}

function roundtableView(){
  const g=state.game;
  const current=currentNode();
  const step=g.rtStep||0;
  const done=step>=current.messages.length;
  const activeMsg=!done?current.messages[step]:null;
  const activeName=activeMsg?activeMsg[0]:null;
  const urgentClass = state.gameTime <= 15 ? 'timer-urgent' : '';

  let speakerKey = 'Leader';
  let tailLeft = '32%';
  let bubbleTop = '17%';

  if (activeName) {
    const low = activeName.toLowerCase();
    if (low.includes('doer') || activeName === 'A') {
      speakerKey = 'Doer';
      tailLeft = '18%';
      bubbleTop = '22%';
    } else if (low.includes('leader')) {
      speakerKey = 'Leader';
      tailLeft = '32%';
      bubbleTop = '17%';
    } else if (low.includes('qc') || activeName === 'B') {
      speakerKey = 'QC';
      tailLeft = '68%';
      bubbleTop = '17%';
    } else if (low.includes('mediator')) {
      speakerKey = 'Mediator';
      tailLeft = '82%';
      bubbleTop = '22%';
    } else if (low.includes('bạn thân') || low.includes('follower')) {
      speakerKey = 'BanThan';
      tailLeft = '70%';
      bubbleTop = '26%';
    }
  }

  const moods = done
    ? { Leader: 'worried', QC: 'thoughtful', Doer: 'worried', Mediator: 'thoughtful', BanThan: 'worried' }
    : getRoundtableMoodsPDF(current, step, activeMsg);

  setTimeout(() => {
    applyRoundtableExpressions(moods);
    if (!done && activeName && activeName !== 'Hệ thống') {
      focusRoundtableSpeaker(speakerKey);
      startMouthFlap(speakerKey);
    } else {
      focusRoundtableSpeaker(null);
      stopMouthFlap();
    }
  }, 30);

  const levelName = g.mode === 'reversal' ? 'Đảo Vai' : (level(g.level)?.name || 'Nhóm Bạn Thân');

  return shell('interior-page rt-page', `
    <header class="rt-head-v5">
      <div class="rt-head-pill left">
        <span class="rt-head-dot"></span>
        <b>Ải ${g.level}: ${safe(levelName)}</b>
      </div>
      <div class="rt-head-pill right">
        <span class="rt-head-heart">❤️</span>
        <span>Thấu cảm: <b>${state.empathy || 50}</b></span>
      </div>
    </header>

    <div class="rt-v5-scene ${done ? 'rt-dimmed' : ''}">
      <div class="rt-backdrop-wrap">
        ${ROUNDTABLE_BACKDROP_SVG}
      </div>

      <div class="rt-chars-wrap">
        ${ROUNDTABLE_CHARACTERS_HTML}
      </div>

      ${!done ? `
        <div class="rt-bubble-v5" style="top:${bubbleTop}" data-action="rt-next">
          <div class="rt-bubble-header">
            <span class="rt-speaker-badge speaker-${speakerKey.toLowerCase()}">${safe(activeName)}</span>
            <span class="rt-step-counter">${step + 1} / ${current.messages.length}</span>
          </div>
          <p class="rt-bubble-quote">“${safe(activeMsg[1].replace(/^[“"]|[”"]$/g, ''))}”</p>
          <div class="rt-bubble-tail" style="left:${tailLeft}"></div>
        </div>
      ` : `
        <div class="rt-decision">
          <div class="decision-head">
            <b>${safe(current.prompt || current.title || 'Bạn sẽ phản hồi thế nào?')}</b>
            <small>60 GIÂY / LƯỢT</small>
          </div>
          <div class="time-track">
            <span id="time-fill" style="width:${state.gameTime / TURN_SECONDS * 100}%"></span>
          </div>
          ${current.options.map((o, i) => `
            <button class="decision-choice" data-choice="${i}">
              <span>${String.fromCharCode(65 + i)}</span>
              ${safe(o.text)}
            </button>
          `).join('')}
        </div>
      `}

      ${!done ? `
        <div class="rt-bottom-bar">
          <button class="rt-btn-restart" data-action="rt-restart">
            <span class="rt-btn-icon">↺</span> Chơi lại
          </button>
          <button class="rt-btn-next" data-action="rt-next">
            <span>${step + 1 < current.messages.length ? 'Tiếp theo' : 'Đưa ra quyết định'}</span>
            <span class="rt-btn-arrow">▶</span>
          </button>
        </div>
      ` : ''}
    </div>
  `);
}

    ${topbar('Thẻ phong cách','home')}
    <div class="page-body">
      <div class="id-card" id="persona-card">
        <span class="id-star s1">${icon('star')}</span><span class="id-star s2">${icon('star')}</span><span class="id-star s3">${icon('star')}</span>
        <div class="id-card-title">${safe(p.title)}</div>
        <div class="id-card-body">
          <div class="id-photo"><div class="id-photo-frame">${player('happy','id-photo-char')}</div></div>
          <div class="id-info">
            <small>MÃ ĐỊNH DANH</small>
            <span class="id-handle">${safe(p.handle)}</span>
            <small>ĐỘI</small>
            <span class="id-team">TEAM-CRAFT · ĐHQGHN</span>
          </div>
        </div>
        <p class="id-desc">${safe(p.desc)}</p>
        <div class="id-card-foot"><span>THẺ KHÁM PHÁ PHONG CÁCH LÀM VIỆC NHÓM</span></div>
        <div class="id-stamp"><span>TEAM<br>CRAFT</span><small>ĐÃ XÁC NHẬN</small></div>
      </div>
      <div class="persona-actions">
        <button class="game-btn sky" data-action="download-persona">${icon('book')} Tải ảnh</button>
        <button class="game-btn pale" data-action="share-persona">${icon('send')} Chia sẻ</button>
      </div>
      <div class="lesson-card"><strong>Gợi ý của TEAM-CRAFT</strong><p>${safe(p.tip)}</p></div>
      ${btn(`${icon('play')} Vào game mô phỏng`,'map','green full')}
    </div>
  `);
}

async function captureEl(id){
  const el=document.getElementById(id);if(!el)return null;
  if(typeof window.html2canvas!=='function'){toast('Thiếu thư viện html2canvas, cần kết nối mạng để tải ảnh');return null}
  try{if(document.fonts?.ready)await document.fonts.ready;return await window.html2canvas(el,{backgroundColor:null,scale:2,useCORS:true})}catch{toast('Tạo ảnh thất bại, thử lại nhé');return null}
}
function cardBlob(canvas){return new Promise(res=>canvas.toBlob(res,'image/png'))}
async function downloadCard(id,filename){
  toast('Đang tạo ảnh...');
  const canvas=await captureEl(id);
  if(!canvas)return;
  const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=filename;a.click();
  toast('Đã tải ảnh về máy');
}
async function shareCard(id,filename,title,text){
  toast('Đang tạo ảnh...');
  const canvas=await captureEl(id);
  if(!canvas)return;
  const blob=await cardBlob(canvas);
  if(!blob)return toast('Tạo ảnh thất bại, thử lại nhé');
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title,text})}
    catch(err){if(err?.name!=='AbortError')toast('Không thể chia sẻ lúc này')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  toast('Đã tải ảnh về để bạn tự đăng lên Story/Post nhé!');
}

// -------------------------------------------------------------
// 9. GAME ENGINE & CLOCK
// -------------------------------------------------------------
function render(){
  const mapRender={
    charSelect: charSelectView,
    home, map,
    roles: rolesView,
    custom: customView,
    shop: shopView,
    stages: stagesView,
    comingSoon: comingSoonView,
    quiz: quizView,
    quizResult,
    chat: chatOrRoundtable,
    polaroid: polaroidView,
    scrapbook: scrapbookView,
    ending: endingView,
    levelComplete: levelCompleteView,
    wallet: walletView,
    replay: ()=>{ startGame(); return ''; }
  };
  ROOT.innerHTML = (mapRender[state.screen]||home)();
  if(state.screen==='chat'){
    document.getElementById('message-zone')?.scrollTo(0,9999);
    runGameClock();
  }
  if(state.screen==='quiz') runQuizClock();
}

function runQuizClock(){
  stopClock();
  clock=setInterval(()=>{
    if(state.screen!=='quiz'){stopClock();return;}
    state.quizTime=Math.max(0,state.quizTime-1);
    const el=document.getElementById('quiz-count');
    if(el)el.textContent=state.quizTime+'s';
    if(state.quizTime===0)finishQuiz();
  },1000);
}

function runGameClock(){
  stopClock();
  clock=setInterval(()=>{
    if(state.screen!=='chat'){stopClock();return;}
    state.gameTime=Math.max(0,state.gameTime-1);
    const el=document.getElementById('game-count');
    const bar=document.getElementById('time-fill');
    if(el){
      el.textContent=fmtTime(state.gameTime);
      el.classList.toggle('timer-urgent', state.gameTime<=15);
    }
    if(bar)bar.style.width=(state.gameTime/TURN_SECONDS*100)+'%';
    if(state.gameTime===0)autoGameEnd();
  },1000);
}

function startQuiz(){
  state.quizIndex=0;state.quizAnswers=[];state.quizTime=60;route('quiz');
}
function chooseQuiz(index){
  const ans=quizQuestions[state.quizIndex].answers[index];
  if(!ans)return;
  state.quizAnswers.push(ans[1]);
  if(state.quizIndex===4)finishQuiz();
  else {state.quizIndex++;render();}
}
function finishQuiz(){
  const tally={};state.quizAnswers.forEach(x=>tally[x]=(tally[x]||0)+1);
  state.persona=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0]||'bee';
  save();
  route('quizResult');
}

function openLevel(id){
  const lvlId=Number(id);
  state.level=lvlId;
  if(lvlId>2)return route('comingSoon');
  route('stages');
}

function openStage(index){
  state.stage=Number(index);
  const l=level(state.level);
  if(l.id>2)return route('comingSoon');
  if(!isLevelUnlocked(l.id)){toast(`Ải ${l.id} chưa mở khóa!`);return route('map');}
  if(!isStageUnlocked(l.id,state.stage)){toast(`Màn ${state.stage+1} chưa mở khóa! Hãy hoàn thành màn trước.`);return route('stages');}
  const stageKey=`${l.id}:${state.stage}`;
  if(!quickScenarios[stageKey])return route('comingSoon');
  const targetRole=stageRoleMap?.[stageKey]||(l.roles.includes(state.role)?state.role:l.roles[0]);
  state.role=targetRole;
  save();
  startGame();
}

function startGame(){
  state.game={level:state.level, role:state.role, mode:'main', history:[], quickOutcome:null, reversalOutcome:null, lastOutcome:null, rtStep:0};
  state.gameTime=TURN_SECONDS;
  route('chat');
}

function finishMain(){
  const key=`${state.game.level}:${state.stage}:${state.role}`;
  if(!state.done.includes(key))state.done.push(key);
  const l=level(state.level);
  if(state.stage<l.stages.length-1){
    unlockStage(state.level,state.stage+1);
  }else{
    const nextLvlId=state.level+1;
    if(nextLvlId<=levels.length){unlockLevel(nextLvlId);}
  }
  save();
  // V5 Flow: chuyển sang Polaroid -> Scrapbook Result
  route('polaroid');
}

function nextStage(){
  const l=level(state.level);
  const nextIndex=state.stage+1;
  if(nextIndex<l.stages.length){
    state.stage=nextIndex;
    unlockStage(state.level,nextIndex);
    openStage(nextIndex);
  }else{
    if(state.level>=2){finishCampaign()}else{nextLevel()}
  }
}

function nextLevel(){
  const nextLvlId=state.level+1;
  const nextLvl=levels.find(x=>x.id===nextLvlId);
  if(!nextLvl||nextLvlId>2)return finishCampaign();
  state.level=nextLvlId;
  state.stage=0;
  unlockLevel(nextLvlId);
  unlockStage(nextLvlId,0);
  const stageKey=`${nextLvlId}:0`;
  const targetRole=stageRoleMap?.[stageKey]||nextLvl.roles[0];
  state.role=targetRole;
  save();
  toast(`Bắt đầu Ải ${nextLvl.id}: ${nextLvl.name}`);
  startGame();
}

function answerGame(index){
  const g=state.game;
  const node=currentNode();
  const o=node.options[index];
  if(!o)return;

  // Hiệu ứng rung lắc nếu kết quả tiêu cực/căng thẳng
  if(o.type==='bad'){
    const device=document.querySelector('.device');
    if(device){
      device.classList.remove('screen-shake');
      void device.offsetWidth;
      device.classList.add('screen-shake');
    }
  }

  g.history.push(...node.messages.map(([name,text])=>({name,text})),{name:'Bạn',text:o.template||o.text});

  if(g.mode==='reversal'){
    applyReward(o.type,10);
    g.reversalOutcome={name:'Đảo vai hoàn tất',type:o.type,answer:o.answer,lesson:o.lesson,development:o.development,result:o.result,positive:o.positive,negative:o.negative};
    g.lastOutcome=g.reversalOutcome;
    route('polaroid');
    return;
  }

  applyReward(o.type,20);
  g.quickOutcome={
    name:o.name||(o.type==='good'?'Cả nhóm đã tiến lên!':o.type==='bad'?'Nhóm vẫn bế tắc':'Có điều cần cải thiện'),
    type:o.type,
    answer:o.answer,
    lesson:o.lesson,
    template:o.template,
    development:o.development,
    result:o.result,
    positive:o.positive,
    negative:o.negative
  };
  g.lastOutcome=g.quickOutcome;
  finishMain();
}

function autoGameEnd(){
  const g=state.game;
  if(!g)return;
  applyReward('bad',0);
  const outcome = {
    name:'Bỏ lỡ lượt phản hồi',
    type:'mid',
    answer:'Cả nhóm không nhận được phản hồi kịp thời từ bạn.',
    lesson:'Chủ động lên tiếng đúng lúc giúp nhóm tránh bị động và bế tắc.',
    development:'Hết thời gian 60 giây, nhóm phải tự xoay xở.',
    result:'Tiến độ bị chậm trễ.',
    positive:'Không gây tranh cãi lớn.',
    negative:'Sự im lặng khiến nhóm hoang mang.'
  };
  if(g.mode==='reversal'){
    g.reversalOutcome=outcome;
    g.lastOutcome=outcome;
    route('polaroid');
    return;
  }
  g.quickOutcome=outcome;
  g.lastOutcome=outcome;
  finishMain();
}

function startReversal(){
  state.game={...state.game,mode:'reversal',history:[],rtStep:0};
  state.gameTime=TURN_SECONDS;
  route('chat');
}

function saveTemplate(){
  const o=getEnding();
  if(!o?.template)return;
  state.wallet.unshift({level:state.game.level,text:o.template});
  state.wallet=state.wallet.slice(0,30);
  save();
  toast('Đã lưu mẫu tin nhắn vào ví kịch bản!');
}

async function copyWallet(index){
  const w=state.wallet[index];
  if(!w)return;
  try{await navigator.clipboard.writeText(w.text);toast('Đã sao chép vào bộ nhớ tạm')}catch{toast('Trình duyệt không cho phép sao chép tự động')}
}

// -------------------------------------------------------------
// 10. EVENT LISTENERS
// -------------------------------------------------------------
ROOT.addEventListener('click',e=>{
  let x=e.target.closest('[data-go]');
  if(x){
    if(x.dataset.go==='replay')return startGame();
    if(x.dataset.go==='next-stage')return nextStage();
    if(x.dataset.go==='next-level')return nextLevel();
    if(x.dataset.go==='finish-campaign')return finishCampaign();
    return route(x.dataset.go);
  }
  x=e.target.closest('[data-level]');
  if(x){
    const lvlId=Number(x.dataset.level);
    if(lvlId>2){return openLevel(lvlId)}
    if(!isLevelUnlocked(lvlId)){toast(`Ải ${lvlId} chưa mở khóa! Hãy hoàn thành ải trước.`);return}
    return openLevel(lvlId);
  }
  x=e.target.closest('[data-set-avatar]');
  if(x){
    state.avatarType=x.dataset.setAvatar;
    save();
    return render();
  }
  x=e.target.closest('[data-role]');
  if(x){
    state.role=x.dataset.role;
    save();
    return render();
  }
  x=e.target.closest('[data-outfit]');
  if(x){
    state.outfit=x.dataset.outfit;
    save();
    return render();
  }
  x=e.target.closest('[data-stage]');
  if(x)return openStage(x.dataset.stage);
  x=e.target.closest('[data-quiz]');
  if(x)return chooseQuiz(Number(x.dataset.quiz));
  x=e.target.closest('[data-choice]');
  if(x)return answerGame(Number(x.dataset.choice));
  x=e.target.closest('[data-copy]');
  if(x)return copyWallet(Number(x.dataset.copy));
  x=e.target.closest('[data-buy]');
  if(x)return buyOutfit(x.dataset.buy);

  x=e.target.closest('[data-action]');
  if(!x)return;
  if(x.dataset.action==='confirm-avatar'){
    save();
    route('home');
  }
  if(x.dataset.action==='start-quiz')startQuiz();
  if(x.dataset.action==='save-template')saveTemplate();
  if(x.dataset.action==='download-persona')downloadCard('persona-card','teamcraft-the-phong-cach.png');
  if(x.dataset.action==='share-persona')shareCard('persona-card','teamcraft-the-phong-cach.png','Thẻ phong cách TEAM-CRAFT','Mình vừa khám phá phong cách làm việc nhóm trên TEAM-CRAFT V5!');
  if(x.dataset.action==='download-level')downloadCard('level-complete-card','teamcraft-hoan-thanh-ai.png');
  if(x.dataset.action==='share-level')shareCard('level-complete-card','teamcraft-hoan-thanh-ai.png','Hoàn thành Ải TEAM-CRAFT','Mình vừa vượt qua một Ải drama nhóm trên TEAM-CRAFT!');
  if(x.dataset.action==='reversal')startReversal();
  if(x.dataset.action==='rt-next')advanceRT();
  if(x.dataset.action==='rt-restart'){
    if(state.game){
      state.game.rtStep=0;
      stopMouthFlap();
      render();
    }
  }
  if(x.dataset.action==='next-stage')nextStage();
  if(x.dataset.action==='level-complete')openLevelComplete();
  if(x.dataset.action==='continue-after-level')continueAfterLevel();
});

route(state.screen);

</script></body></html>
