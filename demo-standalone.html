<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TEAM-CRAFT V4 • Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{
  --font-main:'Lexend',sans-serif;
  --font-display:'Baloo 2',cursive,sans-serif;
  font-family:var(--font-main);
  color:#353747;background:#badde8;font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  --ink:#353747;--navy:#344b64;--muted:#69788c;--blue:#53b9ea;--cream:#fff9eb;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% -5%,#ebf8fa,transparent 38%),radial-gradient(circle at 100% 100%,#f7e0cf,transparent 35%),#b9dce8;font-family:var(--font-main);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5}
button,input,textarea,select{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button:focus-visible{outline:3px solid #2674dd;outline-offset:3px}
#app{display:flex;justify-content:center;min-height:100vh}
.device{width:min(100%,430px);min-height:100dvh;background:var(--cream);position:relative;box-shadow:0 0 0 7px #ffffff55,0 22px 65px #526a7940;overflow:hidden}
.page{position:relative;min-height:100dvh;overflow:hidden}
.icon{width:26px;height:26px;object-fit:contain;display:inline-block;vertical-align:middle;pointer-events:none}
.character{object-fit:contain;display:block;filter:drop-shadow(0 6px 0 #304b6133);pointer-events:none}
.brand{font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-size:66px;line-height:.79;letter-spacing:-4px;font-weight:1000;display:inline-flex;flex-direction:column;transform:rotate(-4deg);color:#ffdb65;filter:drop-shadow(3px 6px 0 #29334b);text-align:center}
.brand span{display:block;-webkit-text-stroke:3.7px #29334b;text-shadow:2px 3px 0 #dd8f3d,0 -2px 0 #ffefa1}
.brand span:last-child{color:#f67d52;text-shadow:2px 3px 0 #c64c41,0 -2px 0 #ffab7b}
.brand-sm{font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-size:33px;letter-spacing:-2px;filter:drop-shadow(1px 3px 0 #29334b)}
.brand-sm span{-webkit-text-stroke:2.4px #29334b;text-shadow:1px 2px 0 #dd8f3d}
.home-page{background:linear-gradient(180deg,#95dcf5 0%,#d6f0ef 43%,#eaf5d6 100%)}
.home-page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 25%,#fff9 0 7%,transparent 8%),radial-gradient(circle at 90% 16%,#fff7 0 8%,transparent 9%),radial-gradient(circle at 12% 74%,#96d17f66 0 17%,transparent 18%)}
.home-head{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 18px 4px}
.logo-mark{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:1000;color:#315875;letter-spacing:.4px}
.logo-mark .icon{width:22px;height:22px}
.head-action{background:#fffaf2;border:2px solid #fff;box-shadow:0 4px 0 #4d7b8a33;border-radius:18px;padding:7px 10px;font-weight:900;font-size:11px;color:#496576;display:flex;align-items:center;gap:3px}
.head-action .icon{width:22px;height:22px}
.home-hero{position:relative;text-align:center;padding:12px 17px 0;z-index:1}
.home-ribbon{font-family:var(--font-display);display:inline-block;background:#fff6d9;border:2px solid #e8ca8b;border-radius:99px;color:#92703b;padding:7px 12px;font-size:11px;letter-spacing:.4px;font-weight:800;box-shadow:0 4px 0 #d4ab7633;margin:5px auto 18px}
.hero-tagline{margin:17px 0 6px;font-weight:800;color:#48687c;font-size:15px}
.character-group{height:246px;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 0}
.character-group:before{content:"";position:absolute;width:320px;height:107px;border-radius:50%;bottom:2px;background:linear-gradient(#9ed67b,#77ba67);border:4px solid #7dbb62;box-shadow:0 10px 0 #6ca75c66}
.podium{position:absolute;width:140px;height:38px;background:#e6c5a5;bottom:24px;border-radius:50%;opacity:.7}
.podium-left{left:7%}.podium-right{right:7%}
.home-person{position:absolute;bottom:9px;z-index:2}
.home-person.left{width:130px;left:12%;bottom:8px;transform:rotate(-7deg)}
.home-person.lead{width:174px;left:50%;transform:translateX(-50%);z-index:3;bottom:10px}
.home-person.right{width:130px;right:12%;bottom:9px;transform:rotate(7deg)}
.talk-label{display:inline-block;position:relative;top:-11px;background:#fffef9;border:2px solid #cde4c7;color:#59705e;padding:9px 14px;border-radius:14px;box-shadow:0 4px 0 #a9c799;font-size:12px;font-weight:700}
.home-cta{position:relative;z-index:2;margin:7px 25px 0;display:grid;gap:12px}
.game-btn{font-family:var(--font-display);appearance:none;min-height:48px;padding:9px 12px;border-radius:15px;border:3px solid transparent;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-size:14.5px;font-weight:800;letter-spacing:.3px;line-height:1.2;transition:transform .13s,filter .13s;box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #3a41485b}
.game-btn:hover{filter:brightness(1.04)}
.game-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff80,0 2px 0 #3a41485b}
.game-btn.green{background:linear-gradient(#83e767,#44b93b);border-color:#287d38;color:white;text-shadow:0 2px 0 #267238}
.game-btn.sky{background:linear-gradient(#91dcfa,#4aa8e8);border-color:#3985ba;color:white;text-shadow:0 2px 0 #3978a5}
.game-btn.pale{background:linear-gradient(#fff8e9,#ffe1aa);border-color:#e7b16a;color:#825b31;text-shadow:0 1px 0 #fff}
.game-btn.full{width:100%}.game-btn.large{height:56px;font-size:17px}
.game-btn .icon{width:28px;height:28px}
.home-feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 20px 7px;position:relative;z-index:2}
.home-feature-strip>div{padding:8px 6px;border-radius:14px;background:#fffaf7cb;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #fff;box-shadow:0 3px 0 #bdd5c8;font-size:10px;font-weight:1000;color:#64736c}
.home-feature-strip .icon{width:33px;height:33px}
.footer-note{text-align:center;color:#73948e;font-size:10px;margin:12px 20px 20px;font-weight:800}
/* Map: one new illustration, individual NPC sprites, deliberately NO old map raster overdraw */
.map-page{height:100dvh;min-height:650px;background:#9ad875}
.map-scene{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.map-page:after{content:"";position:absolute;pointer-events:none;left:0;right:0;bottom:0;height:125px;background:linear-gradient(transparent,#3d607c26);z-index:1}
.map-hud{position:absolute;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;gap:12px}
.map-hud-left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.map-logo{border:0;background:none;padding:5px 0 0}
.map-home-btn{background:#fffaf2;border:2px solid #fff;box-shadow:0 3px 0 #3e526d33;border-radius:999px;padding:4px 10px;font-weight:900;font-size:11px;color:#35536b;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:transform .12s,filter .12s;line-height:1}
.map-home-btn:hover{filter:brightness(1.05)}
.map-home-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3e526d33}
.map-home-btn .icon{width:16px;height:16px}
.resources{display:flex;align-items:center;gap:5px;background:#344e61dd;border:2px solid #ffffff9a;padding:3px 7px;border-radius:999px;box-shadow:0 4px 0 #3e526d3d;color:#fff;font-size:12px;font-weight:1000;white-space:nowrap}
.resources span{display:flex;align-items:center;gap:1px}.resources span+span{margin-left:5px}
.resources .icon{width:28px;height:28px}
.map-npc{position:absolute;z-index:2;transform:translate(-50%,-50%);width:69px;filter:drop-shadow(0 4px 2px #35594d44)}
.map-npc.kid-a{width:62px}.map-npc.kid-b{width:68px}.map-npc.kid-c{width:71px}.map-npc.kid-d{width:68px}.map-npc.kid-e{width:71px}
.level-spot{position:absolute;transform:translate(-50%,-50%);z-index:4;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;width:154px;min-height:104px}
.level-orb{width:62px;height:59px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;border:5px solid #fff5e6;box-shadow:0 0 0 3px #3b49569f,0 5px 0 #41455666, inset 0 7px 10px #fff7;background:linear-gradient(#b4ef7c,#3cc33a)}
.level-orb .icon{width:40px;height:40px;filter:drop-shadow(0 2px 0 #27354c44)}
.level-spot.blue .level-orb{background:linear-gradient(#b3ecff,#279ed9)}
.level-spot.orange .level-orb{background:linear-gradient(#ffe3a0,#f2a02a)}
.level-spot.danger .level-orb{background:linear-gradient(#ffb0aa,#ec5f65)}
.level-spot.boss .level-orb{background:linear-gradient(#ebecf1,#777d8f)}
.level-spot.locked .level-orb,
.level-spot.is-coming-soon .level-orb{
  background:linear-gradient(#5a6675,#334155)!important;
  border-color:#94a3b8!important;
  box-shadow:0 0 0 3px #1e293b,0 5px 0 #0f172a88,inset 0 4px 6px #ffffff22!important;
  filter:brightness(0.72)!important;
}
.level-spot.locked:hover .level-orb,
.level-spot.is-coming-soon:hover .level-orb{
  filter:brightness(0.85)!important;
}
.level-spot.is-coming-soon .level-orb .icon,
.level-spot.locked .level-orb .icon{
  width:32px;height:32px;
  filter:drop-shadow(0 2px 2px #0f172a);
}
.level-spot.is-coming-soon .level-copy b,
.level-spot.locked .level-copy b{
  color:#94a3b8!important;
  text-shadow:-1px -1px #0f172a,1px -1px #0f172a,-1px 1px #0f172a,1px 1px #0f172a,0 2px #0f172a!important;
}
@keyframes lockShake{
  0%,100%{transform:translate(-50%,-50%)}
  20%,60%{transform:translate(calc(-50% - 6px),-50%)}
  40%,80%{transform:translate(calc(-50% + 6px),-50%)}
}
.level-spot.lock-shake{animation:lockShake .35s ease-in-out}
.level-copy{display:flex;flex-direction:column;align-items:center;margin-top:7px;text-align:center;min-height:38px;text-shadow:-1px -1px #2c405a,1px -1px #2c405a,-1px 1px #2c405a,1px 1px #2c405a,0 2px #2c405a}
.level-copy b{font-family:var(--font-display);font-size:13px;line-height:1.2;color:#fff;max-width:144px;font-weight:700;letter-spacing:.2px}
.level-copy small{font-family:var(--font-display);display:block;font-size:9.5px;letter-spacing:.4px;font-weight:800;color:#fff6da;margin-top:2px}
.map-dock{position:absolute;left:15px;right:15px;bottom:calc(15px + env(safe-area-inset-bottom));z-index:7;display:grid;grid-template-columns:82px 1fr 82px;gap:8px;align-items:end}
.map-dock button{border:3px solid #fff8df;border-radius:16px;box-shadow:0 4px 0 #36536e,0 7px 8px #395e7845;color:#fff;font-weight:800}
.map-dock .dock-small{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#89d7f8,#419fd2);min-height:61px;font-size:11px;text-shadow:0 1px 0 #3d718c}
.map-dock .dock-small span{font-family:var(--font-display);font-weight:700}
.map-dock .dock-small .icon{height:26px;width:26px}
.map-dock .dock-play{font-family:var(--font-display);min-height:67px;background:linear-gradient(#8aee69,#30bc35);border-color:#fff8d2;display:flex;align-items:center;justify-content:center;gap:7px;font-size:17px;font-weight:800;letter-spacing:.3px;text-shadow:0 2px 0 #2a7a3a}
.map-dock .dock-play .icon{height:32px;width:32px;filter:drop-shadow(0 2px 3px #1b5e2844)}
/* Interior */
.interior-page{background:radial-gradient(circle at 95% 4%,#e2f6d2 0 14%,transparent 15%),linear-gradient(180deg,#c5eaf7,#f7f6de 49%,#fff8ec)}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 6px}
.page-top h1{font-family:var(--font-display);font-size:21px;text-align:center;line-height:1.2;margin:0;color:#344b64;font-weight:800}
.page-top-spacer{width:41px;height:41px}
.circle-action{width:41px;height:41px;padding:3px;border:2px solid #73abc3;background:#eaf9ff;border-radius:50%;box-shadow:0 4px 0 #6c8c9d5a}
.circle-action .icon{width:33px;height:33px}
.page-body{padding:14px 18px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;position:relative;width:100%;max-width:100%;box-sizing:border-box}
.page-intro{background:#fffdf4;border:2px solid #e8dabd;border-radius:15px;padding:12px 14px;font-size:13px;font-weight:800;color:#6c6a69;text-align:center}
.role-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.role-tile{grid-column:span 2;position:relative;min-height:162px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#dff4ff,#fffef4);box-shadow:0 4px 0 #adc6cf;display:flex;flex-direction:column;align-items:center;padding:4px 5px 8px;color:#36455b}
.role-tile:nth-child(2){background:linear-gradient(#ffe1ec,#fffef4)}.role-tile:nth-child(3){background:linear-gradient(#dbfbef,#fffef4)}.role-tile:nth-child(4){grid-column:2/span 2;background:linear-gradient(#f2e8ff,#fffef4)}.role-tile:nth-child(5){grid-column:4/span 2;background:linear-gradient(#fff1cf,#fffef4)}
.role-tile.active{outline:3px solid #4cca74;transform:translateY(-3px);box-shadow:0 7px 0 #75b69a}
.role-figure{height:106px;display:flex;align-items:flex-end;justify-content:center}.role-char{width:91px;height:112px;object-fit:contain}
.role-tile b{font-size:11px;line-height:1.15;text-align:center}.role-tile small{font-size:9px;color:#798797;font-weight:900;margin-top:3px}
.checkmark{position:absolute;right:-6px;top:-8px}.checkmark .icon{width:27px;height:27px}
.role-summary{border:2px solid #e0dabf;border-radius:17px;background:#fffdf1;display:grid;grid-template-columns:75px 1fr;gap:12px;align-items:center;padding:8px 12px}
.role-portrait{height:81px}.portrait-char{width:74px;height:84px}.role-summary strong{color:#385b74;font-size:16px}.role-summary p{color:#6b7282;font-size:12px;line-height:1.45;margin:6px 0 0}
.button-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.button-pair .game-btn{font-size:12px}
.preview-stage{height:288px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:radial-gradient(ellipse at 50% 80%,#a5d3b8 0 36%,transparent 37%),linear-gradient(#bceeff,#eafae5);border-radius:22px;border:3px solid #fff;box-shadow:0 5px 0 #a4bbad}
.preview-stage.small{height:200px}
.preview-ring{position:absolute;width:165px;height:47px;bottom:34px;border-radius:50%;background:#8abd79;box-shadow:inset 0 -7px 0 #73a367}
.preview-character{width:191px;max-height:244px;position:relative;z-index:2}
.preview-stage.small .preview-character{width:150px}
.preview-name{position:absolute;z-index:3;bottom:10px;background:#fff;border:2px solid #d6dabf;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:900}
.subheading{font-size:17px;margin:3px 0 0}
.outfit-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.outfit-item{min-width:0;border:2px solid #e4d6c4;border-radius:13px;background:#fff;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 #c5c5b5}
.outfit-item.active{outline:2px solid #49c66a}.outfit-item img{width:52px;height:70px}.outfit-item span{font-size:9px;line-height:1.2;font-weight:900;color:#576779}
.stage-banner{display:grid;grid-template-columns:1fr 115px;gap:5px;align-items:center;border:3px solid #fff;border-radius:22px;padding:14px;background:linear-gradient(100deg,#bee6f9,#e8f8e4);box-shadow:0 5px 0 #b5d7db}
.stage-banner span{font-size:11px;color:#5c8ca3;font-weight:700}.stage-banner h2{font-family:var(--font-display);font-size:22px;margin:6px 0;line-height:1.2;color:#2b485d}.stage-banner p{font-size:12px;color:#68798a;line-height:1.5;margin:0}.banner-char{width:111px}
.level-info{font-size:11px;color:#75848c;font-weight:700}
.stage-list{display:grid;gap:11px}
.stage-item{background:#fffcf5;border:2px solid #e4d8c9;border-radius:18px;box-shadow:0 4px 0 #dbd0c2;display:grid;grid-template-columns:88px 1fr 23px;gap:8px;align-items:center;text-align:left;padding:10px;color:#374b5f}
.stage-item.is-locked{background:#f4f2ef}
.stage-image{width:86px;height:91px;border-radius:13px;background:linear-gradient(#d5eeff,#ebf5e7);display:grid;place-items:center;overflow:hidden}
.is-locked .stage-image{filter:saturate(.55)}
.stage-char{width:75px;height:94px}.stage-text b{font-family:var(--font-display);font-size:13.5px;line-height:1.25;display:block;letter-spacing:.2px}.stage-text small{font-size:11.5px;color:#7d8090;line-height:1.45;display:block;margin:4px 0}.stage-text em{font-family:var(--font-display);font-size:10px;letter-spacing:.3px;font-weight:800;color:#3caa75;font-style:normal}.is-locked .stage-text em{color:#a0948e}.stage-icon .icon{width:22px}
.centered{text-align:center}
.lesson-card{background:#fffcf3;border-radius:20px;border:2px solid #eadabd;padding:15px;box-shadow:0 4px 0 #d6cbb8}
.lesson-card h2{font-family:var(--font-display);margin:10px 0;font-size:21px;line-height:1.25;color:#35495b}.lesson-card p{font-size:13px;line-height:1.6;color:#677182;margin:9px 0 0}
.lesson-card .muted{font-size:11px}
/* Quiz */
.quiz-page{background:linear-gradient(#ffe6f0,#fff5eb 75%,#f6f9e5)}
.progress-header{display:flex;justify-content:space-between;align-items:center;color:#a76f92;font-size:12px;font-weight:700}
.progress-track{height:11px;background:#fff;border:2px solid #efc4d8;border-radius:12px;overflow:hidden}.progress-track span{display:block;height:100%;background:#f38fb5;transition:width .2s}
.quiz-panel{background:#fff9fa;border-radius:22px;padding:16px 15px;border:3px solid #f1d0df;box-shadow:0 6px 0 #e7bccd}
.quiz-figure{height:145px;display:flex;align-items:center;justify-content:center}.quiz-char{width:128px}
.quiz-panel h2{font-family:var(--font-display);font-size:21px;line-height:1.3;margin:12px 0 16px;color:#492c3d}
.quiz-options{display:grid;gap:10px}
.answer,.decision-choice{border:2px solid #e4d5c6;border-radius:12px;text-align:left;padding:11px 12px;background:#fff;display:flex;align-items:center;gap:10px;color:#3d495c;font-weight:600;font-size:13px;line-height:1.45;box-shadow:0 3px 0 #d1c6b6}
.answer:hover,.decision-choice:hover{background:#f4faeb;border-color:#9acfa1}
.answer span,.decision-choice span{background:#eaf1f8;border-radius:8px;padding:6px 9px;font-family:var(--font-display);font-weight:800;color:#5278a0;font-size:13px}
.small-note{font-size:10.5px;line-height:1.5;color:#8c9296;text-align:center;margin:3px 0}
.persona-card{border:3px solid #e899bc;border-radius:22px;background-color:#ffe6f0;background-image:linear-gradient(#f5c9d9aa 1px,transparent 1px),linear-gradient(90deg,#f5c9d9aa 1px,transparent 1px);background-size:25px 25px;padding:15px;box-shadow:0 7px 0 #c886aa}
.persona-heading{font-family:var(--font-display);font-size:12px;letter-spacing:1px;font-weight:800;color:#aa5e84}
.persona-inner{display:grid;grid-template-columns:115px 1fr;align-items:center;gap:12px}.persona-char{width:112px}.persona-inner h2{font-family:var(--font-display);font-size:19px;color:#874766}.persona-inner p{font-size:12.5px;color:#7f5e71;line-height:1.5}.persona-footer{font-family:var(--font-display);font-size:10px;font-weight:800;color:#b47b9e;border-top:2px dashed #e3aec2;padding-top:10px;text-align:center}
/* Chat */
.chat-page{height:100dvh;min-height:690px;display:flex;flex-direction:column;background:#eff8f1}
.chat-head{height:75px;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fffef7;border-bottom:2px solid #dcecd9;flex-shrink:0}
.chat-head .circle-action{width:36px;height:36px;flex-shrink:0}.chat-head .circle-action .icon{width:28px;height:28px}
.chat-head-face{width:44px;height:44px;background:#d8efec;border-radius:13px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.chat-head-face .character{width:47px;height:55px}
.chat-head-text{flex:1;min-width:0}.chat-head-text strong{font-family:var(--font-display);font-size:14px;line-height:1.2;display:block;color:#2a443a}.chat-head-text small{font-size:11px;color:#738b85}

const frameCache = new Map();
async function mascotImage(id) {
  if (frameCache.has(id)) return frameCache.get(id);
  const img = new Image();
  const path = `assets/personas/${id}.svg`;
  const src = window.__assetMap?.[path] || new URL(path, import.meta.url).href;
  const p = new Promise((resolve, reject) => {
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Không tải được linh vật ' + id));
  });
  img.src = src;
  frameCache.set(id, p);
  return p;
}

function roundRect(ctx, x, y, w, h, r, fill, stroke, strokeWidth = 1) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = strokeWidth;
    ctx.stroke();
  }
}

function drawGingham(ctx, w, h, lightColor, darkColor, step = 56) {
  ctx.fillStyle = lightColor;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = darkColor;
  ctx.globalAlpha = 0.42;

  // Vertical bands
  for (let x = 0; x < w; x += step * 2) {
    ctx.fillRect(x, 0, step, h);
  }
  // Horizontal bands
  for (let y = 0; y < h; y += step * 2) {
    ctx.fillRect(0, y, w, step);
  }

  ctx.globalAlpha = 1.0;
}

function drawSparkle(ctx, x, y, size, color = '#ffffff') {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const angle = (i * Math.PI) / 2;
    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
    ctx.lineTo(Math.cos(angle + Math.PI / 4) * (size * 0.22), Math.sin(angle + Math.PI / 4) * (size * 0.22));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFlower(ctx, x, y, r, petalColor, strokeColor = '#2b1c24') {
  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < 5; i++) {
    const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
    const px = Math.cos(angle) * r;
    const py = Math.sin(angle) * r;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = petalColor;
    ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3.5;
    ctx.stroke();
  }
  // Center pistil
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawBarcode(ctx, x, y, w, h, color = '#2b1c24') {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineCap = 'round';

  const pattern = [2, 1, 4, 1, 1, 3, 2, 1, 5, 2, 1, 3, 1, 4, 2, 1, 1, 3, 2, 4, 1, 2, 5, 1, 3, 2, 1, 4];
  let curX = x;
  const barW = w / 48;

  for (let i = 0; i < pattern.length && curX < x + w; i++) {
    const sw = Math.min(pattern[i] * 1.5, 6.5);
    const varH = (i % 5 === 0) ? h * 0.78 : (i % 3 === 0) ? h * 0.9 : h;
    const offsetY = h - varH;

    ctx.lineWidth = sw;
    ctx.beginPath();
    ctx.moveTo(curX, y + offsetY);
    ctx.lineTo(curX, y + h);
    ctx.stroke();

    curX += sw + barW;
  }
  ctx.restore();
}

function drawWavyLine(ctx, x, y, w, color = '#2b1c24', amp = 2.5, freq = 12) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let cx = x; cx <= x + w; cx += 2) {
    const cy = y + Math.sin(((cx - x) / freq) * Math.PI) * amp;
    ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.restore();
}

async function drawPersonaCard(canvas, p, nickname = 'CUT3FROG247', date = new Date()) {
  if (document.fonts?.ready) {
    try { await document.fonts.ready; } catch {}
  }

  const ctx = canvas.getContext('2d');
  const W = 900;
  const H = 1190;
  canvas.width = W;
  canvas.height = H;

  const v = personaStyles[p.id] || personaStyles.bee;

  ctx.clearRect(0, 0, W, H);

  // 1. STORY BACKDROP (Gingham Caro Pattern)
  drawGingham(ctx, W, H, v.ginghamLight, v.ginghamDark, 54);

  // Sparkles & Star Doodles on backdrop
  const sparkles = [
    [110, 110, 24], [780, 140, 22], [90, 480, 18], [810, 520, 26],
    [130, 890, 22], [790, 930, 28], [450, 75, 20], [450, 1115, 22],
    [240, 1135, 14], [670, 1130, 16]
  ];
  for (const [sx, sy, sr] of sparkles) {
    drawSparkle(ctx, sx, sy, sr, '#ffffff');
    drawSparkle(ctx, sx, sy, sr * 0.45, v.headerBg);
  }

  // Crosses (+) & Dots around the backdrop
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 24px sans-serif';
  ctx.fillText('+', 190, 80);
  ctx.fillText('+', 710, 95);
  ctx.fillText('+', 820, 740);
  ctx.fillText('+', 70, 720);

  // Hand-drawn white curved doodle arcs at corners
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  // Top-left doodle arc
  ctx.beginPath();
  ctx.arc(85, 250, 45, Math.PI * 0.7, Math.PI * 1.35);
  ctx.stroke();
  // Bottom-left doodle arc
  ctx.beginPath();
  ctx.arc(80, 960, 55, Math.PI * 0.6, Math.PI * 1.2);
  ctx.stroke();
  // Top-right doodle arc
  ctx.beginPath();
  ctx.arc(815, 260, 50, -Math.PI * 0.3, Math.PI * 0.35);
  ctx.stroke();
  // Bottom-right doodle arc
  ctx.beginPath();
  ctx.arc(815, 980, 50, -Math.PI * 0.25, Math.PI * 0.4);
  ctx.stroke();
  ctx.restore();

  // 2. TILTED CENTRAL ID CARD (rotate ~ -2.4deg)
  const cardW = 790;
  const cardH = 500;
  const cardCenterX = W / 2;
  const cardCenterY = H / 2 - 15;

  ctx.save();
  ctx.translate(cardCenterX, cardCenterY);
  ctx.rotate((-2.4 * Math.PI) / 180);

  const cardLeft = -cardW / 2;
  const cardTop = -cardH / 2;

  // Drop Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(45, 28, 36, 0.22)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetX = 6;
  ctx.shadowOffsetY = 16;
  roundRect(ctx, cardLeft, cardTop, cardW, cardH, 32, '#fffdf8', null);
  ctx.restore();

  // Card Body (Warm cream white)
  roundRect(ctx, cardLeft, cardTop, cardW, cardH, 32, '#fffdf8', v.ink, 6.5);

  // Card Header Banner (Cute rounded banner across top)
  const bannerMargin = 16;
  const bannerW = cardW - bannerMargin * 2;
  const bannerH = 78;
  const bannerX = cardLeft + bannerMargin;
  const bannerY = cardTop + bannerMargin;

  roundRect(ctx, bannerX, bannerY, bannerW, bannerH, 18, v.headerBg, v.ink, 5.5);

  // Header Title
  ctx.fillStyle = v.headerText;
  ctx.font = '800 38px "Baloo 2", "Arial Rounded MT Bold", cursive, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = '1px';
  ctx.fillText('★  TEAM-CRAFT LICENSE  ★', 0, bannerY + bannerH / 2 + 1);

  // 3. LEFT COLUMN: Photo Frame & Mascot
  const photoW = 245;
  const photoH = 265;
  const photoX = cardLeft + 32;
  const photoY = bannerY + bannerH + 20;

  // Photo box frame
  roundRect(ctx, photoX, photoY, photoW, photoH, 16, v.photoBg, v.ink, 5);

  // Mascot Image
  try {
    const mascot = await mascotImage(p.id);
    const pad = 12;
    ctx.drawImage(mascot, photoX + pad, photoY + pad, photoW - pad * 2, photoH - pad * 2);
  } catch (err) {
    console.error('Cannot load mascot:', err);
  }

  // Handwritten Mascot Signature / Name underneath photo
  ctx.font = '800 23px "Baloo 2", "Comic Sans MS", cursive, sans-serif';
  const nameW = ctx.measureText(v.name).width;
  const photoCenterX = photoX + photoW / 2;

  // Tiny cute flower placed with ample breathing room to the left of the signature (no overlap)
  const flowerX = Math.min(photoX + 13, photoCenterX - nameW / 2 - 16);
  drawFlower(ctx, flowerX, photoY + photoH + 24, 6.5, v.flower, v.ink);

  ctx.fillStyle = v.accent;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(v.name, photoCenterX, photoY + photoH + 12);

  // 4. RIGHT COLUMN: Information & 4 Behavioral Indicators
  const infoX = cardLeft + 305;
  const infoY = bannerY + bannerH + 18;

  // Player ID / Nickname row (up to 22 chars with auto-scale & dynamic wavy signature)
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = v.ink;
  const rawId = (nickname && nickname.trim()) ? nickname.trim() : 'CUT3FROG247';
  const displayId = rawId.toUpperCase().slice(0, 22);

  const maxNickW = 380;
  let nickFontSize = 28;
  ctx.font = `800 ${nickFontSize}px "Baloo 2", "Lexend", monospace`;
  while (ctx.measureText(displayId).width > maxNickW && nickFontSize > 18) {
    nickFontSize -= 1;
    ctx.font = `800 ${nickFontSize}px "Baloo 2", "Lexend", monospace`;
  }
  ctx.fillText(displayId, infoX, infoY + 2, maxNickW);

  // Two hand-drawn wavy signature scribble lines dynamically scaling with the ID length
  const nickW = Math.max(ctx.measureText(displayId).width, 180);
  drawWavyLine(ctx, infoX, infoY + 38, Math.min(nickW + 24, 370), v.ink, 2.2, 11);
  drawWavyLine(ctx, infoX, infoY + 45, Math.min(nickW * 0.78, 280), v.ink, 1.8, 9);

  // Title: Persona Title (Large Bold Title with dynamic auto-scaling to avoid overflow)
  const maxTitleW = cardW - 305 - 48; // ~437px safe width inside card
  let titleFontSize = 31;
  ctx.font = `800 ${titleFontSize}px "Baloo 2", "Lexend", cursive, sans-serif`;
  while (ctx.measureText(p.title).width > maxTitleW && titleFontSize > 20) {
    titleFontSize -= 1;
    ctx.font = `800 ${titleFontSize}px "Baloo 2", "Lexend", cursive, sans-serif`;
  }
  ctx.fillStyle = v.ink;
  ctx.fillText(p.title, infoX, infoY + 64, maxTitleW);

  // Subtitle / Caption (Personality / Clan)
  ctx.fillStyle = '#6e5461';
  ctx.font = '600 20px "Lexend", sans-serif';
  ctx.fillText(v.caption, infoX, infoY + 107, maxTitleW);

  // 4 Behavioral Indicators (4 columns)
  const statsY = infoY + 155;
  const colSpacing = 112;

  v.stats.forEach((st, idx) => {
    const colX = infoX + idx * colSpacing;
    // Label
    ctx.fillStyle = '#8c707d';
    ctx.font = '600 13px "Lexend", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(st.label, colX + 42, statsY);

    // Value
    ctx.fillStyle = v.ink;
    ctx.font = '800 21px "Baloo 2", "Lexend", sans-serif';
    ctx.fillText(st.val, colX + 42, statsY + 22);
  });

  // Barcode in Bottom-Right
  const barcodeX = infoX;
  const barcodeY = statsY + 66;
  drawBarcode(ctx, barcodeX, barcodeY, 265, 36, v.ink);

  // Barcode caption
  ctx.fillStyle = '#9b808e';
  ctx.font = '500 12px "Lexend", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(v.code + ' • OFFICIAL ID', barcodeX, barcodeY + 42);

  // 1-2 Cute Pink Cherry Blossom Flowers in Bottom-Right corner of Card
  drawFlower(ctx, cardLeft + cardW - 75, cardTop + cardH - 85, 20, v.flower, v.ink);
  drawFlower(ctx, cardLeft + cardW - 38, cardTop + cardH - 45, 12, v.flower, v.ink);

  ctx.restore(); // Restore rotated card coordinate space

  // 5. BOTTOM STORY FOOTER (Outside Card, on Story Backdrop)
  ctx.fillStyle = v.ink;
  ctx.font = '800 24px "Baloo 2", cursive, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦ THẺ HÀNH NGHỀ TEAMWORK ✦', W / 2, H - 75);

  ctx.fillStyle = '#7a5a6a';
  ctx.font = '500 17px "Lexend", sans-serif';
  ctx.fillText(v.trait + ' · TEAM-CRAFT SIMULATOR', W / 2, H - 42);

  return canvas;
}

async function updatePersonaCanvas(){
 if(state.screen!=='quizResult')return;
 const canvas=document.getElementById('persona-render');if(!canvas)return;
 const current=state.previewPersona||state.persona||'bee';
 const p=personas.find(x=>x.id===current)||personas[0];
 const nick=(state.nickname&&state.nickname.trim())?state.nickname.trim():'CUT3FROG247';
 try {await drawPersonaCard(canvas,p,nick)} catch(err){console.error(err); toast('Không tải được hình linh vật. Vui lòng thử mở bằng localhost.');}
}
function imageBlob(canvas){return new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}
async function getCardFile(){
 const canvas=document.getElementById('persona-render');if(!canvas)return null;
 await updatePersonaCanvas();
 const blob=await imageBlob(canvas);if(!blob)return null;
 const id=(state.previewPersona||state.persona||'bee').replace(/[^a-z0-9_-]/gi,'');
 return new File([blob],`TEAM-CRAFT-card-${id}.png`,{type:'image/png'});
}
function saveFile(file){
 const a=document.createElement('a');const url=URL.createObjectURL(file);a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
async function downloadPersonaCard(){const file=await getCardFile();if(!file)return toast('Chưa tạo được ảnh.');saveFile(file);toast('Đã tạo ảnh PNG để đăng Story!')}
async function sharePersonaCard(){
 const file=await getCardFile();if(!file)return toast('Chưa tạo được ảnh.');
 try {
  if(navigator.share && navigator.canShare?.({files:[file]})){
   await navigator.share({files:[file],title:'Thẻ TEAM-CRAFT của mình',text:'Còn bạn thuộc phong cách làm việc nhóm nào?'});
  } else {saveFile(file);toast('Thiết bị chưa hỗ trợ chia sẻ ảnh trực tiếp. Đã tải PNG để bạn đăng Story.');}
 } catch(e){ if(e.name!=='AbortError'){saveFile(file);toast('Đã tải ảnh PNG để chia sẻ thủ công.');} }
}

const talkSprites={
  'Minh':'doer','Lan':'mediator','Huy':'follower','An':'leader','Bạn':null,'Hệ thống':'follower',
  'Minh (suy nghĩ)':'doer','Doer (suy nghĩ)':'doer',
  'Leader':'leader','Doer':'doer','QC':'qc','Mediator':'mediator','Follower':'follower'
};
function bubble(name,msg){
  const mine=name==='Bạn';
  const normName=name.toLowerCase();
  const id=talkSprites[name]||(roles.some(r=>r.id===normName)?normName:state.role);
  return `<div class="bubble-row ${mine?'self':''}"><span class="bubble-avatar">${avatar(id,'bubble-character',name==='Hệ thống'?'idle':'talk')}</span><div class="bubble-content"><small>${safe(name)}</small><p>${safe(msg)}</p></div></div>`
}

function currentNode(){
  const g=state.game;
  if(g.mode==='reversal'){
    if(g.level===2)return {messages:[['Minh (suy nghĩ)','Mới vào nhóm lạ, mình không biết nhận phần nào, nhưng rất ngại hỏi...'],['An','Có ai muốn nhận phần mở đầu không?']],prompt:'Ở góc nhìn người mới, bạn làm gì?',options:[{text:'Giới thiệu thế mạnh, hỏi rõ đầu việc và deadline.',type:'good',answer:'Cả nhóm bắt đầu mở lời và chủ động phân công.',lesson:'Phá băng bắt đầu từ một lời xác nhận cụ thể.'},{text:'Tiếp tục im lặng để tránh bị chú ý.',type:'bad',answer:'Leader không biết bạn có thể làm gì, việc bị chậm.',lesson:'Im lặng có thể bị hiểu nhầm là thiếu hợp tác.'}]};
    return {messages:reversal.messages,prompt:'Là Minh, bạn sẽ phản hồi thế nào?',options:reversal.choices};
  }
  const stageKey=`${g.level}:${state.stage}`;
  if(stageScenarios[stageKey]){
    const sc=stageScenarios[stageKey];
    return {messages:sc.messages,prompt:sc.prompt||sc.title,options:sc.choices};
  }
  if(quickScenarios[stageKey]){
    const sc=quickScenarios[stageKey];
    return {messages:sc.messages,prompt:sc.prompt||sc.title,options:sc.choices};
  }
  if(g.level===1 && g.role==='leader' && leaderTree[g.node])return leaderTree[g.node];
  const q=quickScenarios[`${g.level}:${g.role}`]||quickScenarios['1:0'];
  return {...q,prompt:q.prompt||q.title,options:q.choices};
}

  const g=state.game;
  const current=currentNode();
  const lines=[...g.history,...current.messages.map(([name,text])=>({name,text}))];
  return shell('chat-page',`
<header class="chat-head"><button class="circle-action" data-go="stages" aria-label="Quay lại">${icon('back')}</button><span class="chat-head-face">${player('idle')}</span><div class="chat-head-text"><strong>${g.mode==='reversal'?'ĐẢO VAI / GÓC NHÌN KHÁC':'Nhóm Bài Tập · Ải '+g.level}</strong><small>Bạn đang là ${safe(role(g.role).name)}</small></div><span class="timer" id="game-count">${state.gameTime}s</span><button class="circle-action" data-go="home" aria-label="Trang chủ">${icon('home')}</button></header>
<div class="message-zone" id="message-zone"><div class="privacy-note">MÔ PHỎNG CHAT • KHÔNG GỬI TIN THẬT</div>${lines.map(x=>bubble(x.name,x.text)).join('')}</div>
<div class="decision-box"><div class="decision-head"><b>${safe(current.prompt||current.title||'Bạn sẽ phản hồi thế nào?')}</b><small>20 GIÂY / LƯỢT</small></div><div class="time-track"><span id="time-fill" style="width:${state.gameTime*5}%"></span></div>
${current.options.map((o,i)=>`<button class="decision-choice" data-choice="${i}"><span>${String.fromCharCode(65+i)}</span>${safe(o.text)}</button>`).join('')}</div>`)}

function getEnding(){
  const g=state.game;
  if(g.mode==='reversal')return g.reversalOutcome;
  if(g.ending)return leaderEndings[g.ending]||leaderEndings.E1;
  return g.quickOutcome;
}

  const tone=o.tone||o.type||'mid';
  const l=level(state.level);
  const nextStageIndex=state.stage+1;
  const hasNextStage=nextStageIndex<l.stages.length;
  const nextLvlId=state.level+1;
  const nextLvl=levels.find(x=>x.id===nextLvlId);
  const isFinalCampaignLevel=state.level===2&&!hasNextStage;
  const hasNextLevel=!hasNextStage&&Boolean(nextLvl)&&!isFinalCampaignLevel;
  return shell('interior-page ending-page',`${topbar(g.mode==='reversal'?'Đảo vai hoàn tất':'Lesson Unlocked','stages',true)}
<div class="page-body"><div class="ending-medal ${tone}">${avatar(tone==='good'?'follower':tone==='bad'?'qc':'mediator','medal-character',tone==='good'?'walk_a':'idle')}</div>
<h2 class="ending-title">${safe(o.name||(tone==='good'?'Giải quyết hiệu quả':tone==='bad'?'Nhóm gặp khó khăn':'Cần điều chỉnh'))}</h2><p class="ending-desc">${safe(o.message||o.answer)}</p>
<div class="lesson-card"><div class="lesson-caption">${icon('book')} LESSON UNLOCKED</div><p>${safe(o.lesson)}</p></div>
${o.template?`<div class="lesson-card template-card"><strong>VÍ KỊCH BẢN • MẪU TIN NHẮN</strong><p>${safe(o.template)}</p><button class="small-button" data-action="save-template">${icon('check')} Lưu mẫu tin nhắn</button></div>`:''}
<div class="action-stack">
  ${hasNextStage?`<button class="game-btn green full" data-action="next-stage">${icon('play')} Màn tiếp theo</button>`:''}
  ${hasNextLevel?`<button class="game-btn green full" data-action="next-level">${icon('play')} Sang Ải ${nextLvl.id}: ${safe(nextLvl.name)}</button>`:''}
  ${isFinalCampaignLevel?`<button class="game-btn green full" data-action="finish-campaign">${icon('spark')} Xem lộ trình tiếp theo</button>`:''}
  ${g.mode==='reversal'?'':`<button class="game-btn pale full" data-action="reversal">${icon('rotate')} THỬ ĐẢO VAI</button>`}
  <div class="button-pair">${btn('Chơi lại','replay','sky')}${btn('Bản đồ','map',hasNextStage||hasNextLevel||isFinalCampaignLevel?'pale':'green')}</div>
</div><p class="small-note">Kết quả chỉ là tình huống mô phỏng, không dự đoán chắc chắn phản ứng ngoài đời.</p></div>`)}

function walletView(){return shell('interior-page',`${topbar('Ví kịch bản','map',true)}<div class="page-body"><div class="page-intro">Lưu và sao chép các mẫu tin nhắn từ màn chơi đã hoàn thành.</div>${state.wallet.length?state.wallet.map((w,i)=>`<article class="lesson-card wallet-item"><strong>Mẫu tin nhắn ${i+1}</strong><p>${safe(w.text)}</p><button class="small-button" data-copy="${i}">${icon('chat')} Sao chép</button></article>`).join(''):`<div class="empty-wallet">${avatar('follower','empty-char')}<h2>Ví của bạn đang trống</h2><p>Hoàn thành một màn chơi để lưu tin nhắn thực chiến.</p></div>`}${btn('Quay lại bản đồ','map','green full')}</div>`)}

function render(){
  const mapRender={home,map,roles:rolesView,custom:customView,stages:stagesView,stageIntro,stagePreview,comingSoon:comingSoonView,quiz:quizView,quizResult,personaGallery,chat:chatView,ending:endingView,wallet:walletView,replay:()=>{startGame();return ''}};
  ROOT.innerHTML=(mapRender[state.screen]||home)();
  if(state.screen==='quizResult')updatePersonaCanvas();
  if(state.screen==='chat'){document.getElementById('message-zone')?.scrollTo(0,9999)}
  if(state.screen==='quiz')runQuizClock();
  if(state.screen==='chat')runGameClock();
}

function runQuizClock(){stopClock();clock=setInterval(()=>{if(state.screen!=='quiz'){stopClock();return;}state.quizTime=Math.max(0,state.quizTime-1);const el=document.getElementById('quiz-count');if(el)el.textContent=state.quizTime+'s';if(state.quizTime===0)finishQuiz()},1000)}
function runGameClock(){stopClock();clock=setInterval(()=>{if(state.screen!=='chat'){stopClock();return;}state.gameTime=Math.max(0,state.gameTime-1);const el=document.getElementById('game-count');const bar=document.getElementById('time-fill');if(el)el.textContent=state.gameTime+'s';if(bar)bar.style.width=(state.gameTime*5)+'%';if(state.gameTime===0)autoGameEnd()},1000)}

function startQuiz(){state.previewPersona=null;state.quizIndex=0;state.quizAnswers=[];state.quizTime=60;route('quiz')}
function chooseQuiz(index){const ans=quizQuestions[state.quizIndex].answers[index];if(!ans)return;state.quizAnswers.push(ans[1]);if(state.quizIndex===4)finishQuiz();else {state.quizIndex++;render()}}
function finishQuiz(){state.previewPersona=null;const tally={};state.quizAnswers.forEach(x=>tally[x]=(tally[x]||0)+1);state.persona=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0]||'bee';save();route('quizResult')}

function openLevel(id){
  const lvlId=Number(id);
  if(lvlId>2){
    toast('Nội dung Ải này đang được cập nhật. Hãy hoàn thành Ải 1 & Ải 2 trước nhé!');
    return;
  }
  if(!isLevelUnlocked(lvlId)){
    toast(`Ải ${lvlId} chưa mở khóa! Hãy hoàn thành ải trước.`);
    return;
  }
  state.level=lvlId;
  route('stages');
}

function openStage(index){
  state.stage=Number(index);
  const l=level(state.level);
  if(l.id>2)return route('comingSoon');
  if(!isLevelUnlocked(l.id)){
    toast(`Ải ${l.id} chưa mở khóa!`);
    return route('map');
  }
  if(!isStageUnlocked(l.id,state.stage)){
    toast(`Màn ${state.stage+1} chưa mở khóa! Hãy hoàn thành màn trước.`);
    return route('stages');
  }
  const stageKey=`${l.id}:${state.stage}`;
  if(!stageScenarios[stageKey]&&!quickScenarios[stageKey])return route('stagePreview');
  const targetRole=stageRoleMap?.[stageKey]||(l.roles.includes(state.role)?state.role:l.roles[0]);
  if(state.role!==targetRole){
    state.role=targetRole;
    save();
  }
  route('stageIntro');
}

function startGame(){
  state.game={level:state.level,role:state.role,mode:'main',node:'start',history:[],ending:null,quickOutcome:null,reversalOutcome:null};
  state.gameTime=20;
  route('chat');
}

function finishMain(){
  const key=`${state.game.level}:${state.stage}:${state.role}`;
  if(!state.done.includes(key))state.done.push(key);
  const l=level(state.level);
  if(state.stage<l.stages.length-1){
    unlockStage(state.level,state.stage+1);
  }else{
    const nextLvlId=state.level+1;
    if(nextLvlId<=levels.length){
      unlockLevel(nextLvlId);
      unlockStage(nextLvlId,0);
    }
  }
  save();
  route('ending');
}

function nextStage(){
  const l=level(state.level);
  const nextIndex=state.stage+1;
  if(nextIndex<l.stages.length){
    state.stage=nextIndex;
    unlockStage(state.level,nextIndex);
    openStage(nextIndex);
  }else{
    if(state.level>=2){
      finishCampaign();
    }else{
      nextLevel();
    }
  }
}

function nextLevel(){
  const nextLvlId=state.level+1;
  const nextLvl=levels.find(x=>x.id===nextLvlId);
  if(!nextLvl||nextLvlId>2)return finishCampaign();
  state.level=nextLvlId;
  state.stage=0;
  unlockLevel(nextLvlId);
  unlockStage(nextLvlId,0);
  const stageKey=`${nextLvlId}:0`;
  const targetRole=stageRoleMap?.[stageKey]||nextLvl.roles[0];
  state.role=targetRole;
  save();
  toast(`Bắt đầu Ải ${nextLvl.id}: ${nextLvl.name}`);
  openStage(0);
}

function finishCampaign(){
  toast('Chúc mừng bạn đã hoàn thành toàn bộ nội dung hiện có (Ải 1 & Ải 2)! Các Ải 3, 4, 5 đang được cập nhật.');
  route('map');
}

function playCampaign(){
  const l1=levels[0];
  const l2=levels[1];
  const l1Unfinished=l1.stages.findIndex((_,i)=>!state.done.some(k=>k.startsWith(`1:${i}:`)));
  if(l1Unfinished!==-1){
    state.level=1;
    state.stage=l1Unfinished;
    if(!isStageUnlocked(1,l1Unfinished))unlockStage(1,l1Unfinished);
    save();
    return openStage(l1Unfinished);
  }
  if(!isLevelUnlocked(2)){
    unlockLevel(2);
    unlockStage(2,0);
  }
  const l2Unfinished=l2.stages.findIndex((_,i)=>!state.done.some(k=>k.startsWith(`2:${i}:`)));
  if(l2Unfinished!==-1){
    state.level=2;
    state.stage=l2Unfinished;
    if(!isStageUnlocked(2,l2Unfinished))unlockStage(2,l2Unfinished);
    save();
    return openStage(l2Unfinished);
  }
  toast('Bạn đã hoàn thành toàn bộ nội dung hiện có! Đang mở Ải 1 để bạn trải nghiệm lại.');
  state.level=1;
  state.stage=0;
  save();
  route('stages');
}

function answerGame(index){
  const g=state.game;
  const node=currentNode();
  const o=node.options[index];
  if(!o)return;
  g.history.push(...node.messages.map(([name,text])=>({name,text})),{name:'Bạn',text:o.template||o.text});
  if(g.mode==='reversal'){
    g.reversalOutcome={name:'Đảo vai hoàn tất',type:o.type,answer:o.answer,lesson:o.lesson};
    route('ending');
    return;
  }
  if(o.to){
    if(o.to.startsWith('E')){
      g.ending=o.to;
      finishMain();
    }else{
      g.node=o.to;
      state.gameTime=20;
      render();
    }
  }else{
    g.quickOutcome={
      name:o.name||(o.type==='good'?'Cả nhóm đã tiến lên!':o.type==='bad'?'Nhóm vẫn bế tắc':'Có điều cần cải thiện'),
      type:o.type,
      answer:o.answer||o.result,
      lesson:o.lesson,
      template:o.template
    };
    finishMain();
  }
}

function autoGameEnd(){
  const g=state.game;
  if(!g)return;
  if(g.mode==='reversal'){
    g.reversalOutcome={name:'Bỏ lỡ lượt phản hồi',type:'mid',answer:'Cả nhóm không biết bạn đang nghĩ gì.',lesson:'Im lặng cũng ảnh hưởng đến việc phối hợp.'};
    route('ending');
    return;
  }
  if(g.ending)g.ending='E1';
  else g.quickOutcome={name:'Bỏ lỡ lượt phản hồi',type:'mid',answer:'Không có phản hồi kịp thời.',lesson:'Chủ động lên tiếng giúp nhóm hoạt động hiệu quả.'};
  finishMain();
}

function startReversal(){state.game={...state.game,mode:'reversal',history:[]};state.gameTime=20;route('chat')}
function saveTemplate(){const o=getEnding();if(!o?.template)return;state.wallet.unshift({level:state.game.level,text:o.template});state.wallet=state.wallet.slice(0,30);save();toast('Đã lưu mẫu tin nhắn vào ví')}
async function copyWallet(index){const w=state.wallet[index];if(!w)return;try{await navigator.clipboard.writeText(w.text);toast('Đã sao chép')}catch{toast('Trình duyệt không cho phép sao chép tự động')}}

ROOT.addEventListener('click',e=>{
  if(e.target.closest('#btn-focus-nick')||(e.target.closest('.nick-wrap')&&e.target.id!=='player-nickname')){
    const inp=document.getElementById('player-nickname');
    if(inp){inp.focus();inp.select?.();}
    return;
  }
  let x=e.target.closest('[data-go]');
  if(x){
    if(x.dataset.go==='replay'||x.dataset.go==='beginStage')return startGame();
    if(x.dataset.go==='next-stage')return nextStage();
    if(x.dataset.go==='next-level')return nextLevel();
    if(x.dataset.go==='finish-campaign')return finishCampaign();
    return route(x.dataset.go);
  }
  x=e.target.closest('[data-level]');
  if(x){
    const lvlId=Number(x.dataset.level);
    if(lvlId>2){
      x.classList.remove('lock-shake');
      void x.offsetWidth;
      x.classList.add('lock-shake');
      toast('Nội dung Ải này đang được cập nhật. Hãy hoàn thành Ải 1 & Ải 2 trước nhé!');
      return;
    }
    if(!isLevelUnlocked(lvlId)){
      toast(`Ải ${lvlId} chưa mở khóa! Hãy hoàn thành ải trước.`);
      return;
    }
    return openLevel(lvlId);
  }
  x=e.target.closest('[data-role]');if(x){state.role=x.dataset.role;save();return render()}
  x=e.target.closest('[data-custom-role]');if(x){state.role=x.dataset.customRole;save();return route('custom')}
  x=e.target.closest('[data-outfit]');if(x){state.outfit=x.dataset.outfit;save();return render()}
  x=e.target.closest('[data-stage]');if(x)return openStage(x.dataset.stage);
  x=e.target.closest('[data-quiz]');if(x)return chooseQuiz(Number(x.dataset.quiz));
  x=e.target.closest('[data-persona-preview]');if(x){state.previewPersona=x.dataset.personaPreview;return route('quizResult')}
  x=e.target.closest('[data-choice]');if(x)return answerGame(Number(x.dataset.choice));
  x=e.target.closest('[data-copy]');if(x)return copyWallet(Number(x.dataset.copy));
  x=e.target.closest('[data-action]');
  if(!x)return;
  if(x.dataset.action==='play-campaign')return playCampaign();
  if(x.dataset.action==='start-quiz')startQuiz();
  if(x.dataset.action==='save-template')saveTemplate();
  if(x.dataset.action==='reversal')startReversal();
  if(x.dataset.action==='next-stage')nextStage();
  if(x.dataset.action==='next-level')nextLevel();
  if(x.dataset.action==='finish-campaign')finishCampaign();
  if(x.dataset.action==='download-card')downloadPersonaCard();
  if(x.dataset.action==='share-card')sharePersonaCard();
});

ROOT.addEventListener('input',e=>{if(e.target.id==='player-nickname'){state.nickname=e.target.value.slice(0,22);save();updatePersonaCanvas();}});

// Sparkle Click Effect
const SPARKLE_COLORS=['#FFD166','#FF8FAB','#72EFDD','#BDB2FF','#FFFFFF'];
function spawnSparkles(x,y){
  if(typeof x!=='number'||typeof y!=='number'||isNaN(x)||isNaN(y))return;
  const count=6+Math.floor(Math.random()*3);
  const fragment=document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const el=document.createElement('span');
    const color=SPARKLE_COLORS[Math.floor(Math.random()*SPARKLE_COLORS.length)];
    const isStar=i%3!==0;
    const angle=(Math.PI*2*i)/count+(Math.random()-0.5)*0.5;
    const dist=25+Math.random()*30;
    const dx=Math.round(Math.cos(angle)*dist);
    const dy=Math.round(Math.sin(angle)*dist);
    const rot=Math.round((Math.random()-0.5)*180);
    const duration=Math.round(500+Math.random()*150);
    el.className=`click-sparkle ${isStar?'click-sparkle-star':'click-sparkle-dot'}`;
    el.style.left=`${x}px`;
    el.style.top=`${y}px`;
    el.style.setProperty('--dx',`${dx}px`);
    el.style.setProperty('--dy',`${dy}px`);
    el.style.setProperty('--rot',`${rot}deg`);
    el.style.setProperty('--duration',`${duration}ms`);
    if(isStar){
      const size=Math.round(14+Math.random()*8);
      el.style.width=`${size}px`;
      el.style.height=`${size}px`;
      el.innerHTML=`<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path d="M12 0 Q12 12 24 12 Q12 12 12 24 Q12 12 0 12 Q12 12 12 0 Z" fill="${color}"/></svg>`;
    }else{
      const size=Math.round(5+Math.random()*4);
      el.style.width=`${size}px`;
      el.style.height=`${size}px`;
      el.style.background=color;
    }
    el.addEventListener('animationend',()=>el.remove(),{once:true});
    setTimeout(()=>el.remove(),duration+100);
    fragment.appendChild(el);
  }
  document.body.appendChild(fragment);
}
window.addEventListener('pointerdown',e=>{if(e.clientX||e.clientY)spawnSparkles(e.clientX,e.clientY)},{passive:true});

route('home');

</script></body></html>
